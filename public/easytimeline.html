  // ---------------- Gantt (SVG) ----------------
  function scaleConfig(mode){
    if(mode === "days") return { showDay:true, showWeek:false, showMonth:false, headerRows:1 };
    if(mode === "months") return { showDay:false, showWeek:false, showMonth:true, headerRows:1 };
    if(mode === "both") return { showDay:false, showWeek:true, showMonth:true, headerRows:2 };
    return { showDay:false, showWeek:true, showMonth:false, headerRows:1 };
  }
  // The "natural" day width before the zoom control scales it — denser projects start more
  // zoomed out so a first render is usually already readable without the user reaching for
  // the zoom controls at all.
  function basePxPerDayFor(totalDays){
    return totalDays > 50 ? 16 : (totalDays > 28 ? 22 : (totalDays > 14 ? 28 : 38));
  }

  function renderGantt(p, full, rows){
    if(!p.tasks.length) return '';
    var visRows = rows.filter(function(r){ return full.infoFor(r.task.id).scheduled; });
    if(!visRows.length){
      return '<div class="gantt-panel"><p class="table-caption" style="padding:0;">Corrija a dependência circular acima para ver o gráfico de Gantt.</p></div>';
    }
    var rowIndexById = new Map();
    visRows.forEach(function(r,i){ rowIndexById.set(r.task.id, i); });
    function resolveVisibleId(id){
      var cur = id, guard = 0;
      while(cur && !rowIndexById.has(cur) && guard < 60){
        var t = full.tasksById.get(cur);
        cur = t ? t.parentId : null;
        guard++;
      }
      return rowIndexById.has(cur) ? cur : null;
    }

    var cfg = scaleConfig(p.ganttScale);
    var domainStart = full.core.projectStartDate;
    var domainEnd = full.core.projectEndDate;
    var totalDays = Math.max(daysBetween(domainStart, domainEnd) + 1, 1);
    var ganttZoom = p.ganttZoom || 1;
    var pxPerDay = Math.max(4, Math.round(basePxPerDayFor(totalDays) * ganttZoom));
    var labelWidth = p.ganttLabelWidth || 220;
    // When there are two header rows (month + week), reserve an extra top strip so the
    // "HOJE" (today) flag never collides with the month label — both can start near x=0.
    var headerExtra = cfg.headerRows === 2 ? 14 : 0;
    var ROW_H = 34, HEADER_H = (cfg.headerRows === 2 ? 50 : 36) + headerExtra, PAD = 10;
    var chartW = totalDays * pxPerDay + PAD * 2 + 170;
    var chartH = HEADER_H + visRows.length * ROW_H + PAD;
    var dayLabelStep = pxPerDay >= 30 ? 1 : (pxPerDay >= 18 ? 2 : 4);

    var svg = '';
    svg += '<svg width="'+chartW+'" height="'+chartH+'" viewBox="0 0 '+chartW+' '+chartH+'" role="img" aria-label="Gráfico de Gantt do projeto">';
    svg += '<defs>' +
      '<pattern id="hatch-critical-lines" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">' +
        '<line x1="0" y1="0" x2="0" y2="6" class="hatch-line"></line>' +
      '</pattern>' +
      '<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L8,4 L0,8 z" class="arrow-head"></path>' +
      '</marker>' +
    '</defs>';

    var monthLabelY = cfg.headerRows === 2 ? (16 + headerExtra) : (HEADER_H - 7), weekLabelY = cfg.headerRows === 2 ? (34 + headerExtra) : (HEADER_H - 7), dayLabelY = HEADER_H - 7;
    for(var i = 0; i < totalDays; i++){
      var d = addDays(domainStart, i);
      var x = PAD + i * pxPerDay;
      if(isWeekend(d)){
        svg += '<rect x="'+x+'" y="'+HEADER_H+'" width="'+pxPerDay+'" height="'+(chartH-HEADER_H)+'" class="weekend-rect"></rect>';
      }
      var isMonthStart = d.getDate() === 1;
      var isWeekStart = d.getDay() === 1;
      var lineClass = "grid-line";
      if(cfg.showMonth && isMonthStart) lineClass = "grid-line-month";
      else if(cfg.showWeek && isWeekStart) lineClass = "grid-line-strong";
      svg += '<line x1="'+x+'" y1="'+HEADER_H+'" x2="'+x+'" y2="'+chartH+'" class="'+lineClass+'" opacity="'+(lineClass==='grid-line'?0.5:1)+'"></line>';
      if(cfg.showMonth && (isMonthStart || i === 0)){
        svg += '<text x="'+(x+3)+'" y="'+monthLabelY+'" class="axis-label-month">'+fmtMonth(d)+'</text>';
      }
      if(cfg.showWeek && (isWeekStart || i === 0)){
        svg += '<text x="'+(x+3)+'" y="'+weekLabelY+'" class="axis-label">'+fmtShort(d)+'</text>';
      }
      if(cfg.showDay && (i % dayLabelStep === 0)){
        svg += '<text x="'+(x+3)+'" y="'+dayLabelY+'" class="axis-label">'+fmtShort(d)+'</text>';
      }
    }
    var xEnd = PAD + totalDays * pxPerDay;
    svg += '<line x1="'+xEnd+'" y1="'+HEADER_H+'" x2="'+xEnd+'" y2="'+chartH+'" class="grid-line"></line>';
    if(cfg.headerRows === 2){
      var dividerY = 26 + headerExtra;
      svg += '<line x1="0" y1="'+dividerY+'" x2="'+chartW+'" y2="'+dividerY+'" class="grid-line"></line>';
    }

    // dependency connectors (resolved to nearest visible ancestor on both ends)
    var drawnPairs = new Set();
    visRows.forEach(function(row){
      var t = row.task;
      var leafInfo = full.core.byId.get(t.id);
      var depIds = leafInfo ? (leafInfo.deps || []) : [];
      depIds.forEach(function(depId){
        var succVis = resolveVisibleId(t.id);
        var predVis = resolveVisibleId(depId);
        if(!succVis || !predVis || succVis === predVis) return;
        var pairKey = predVis+">"+succVis;
        if(drawnPairs.has(pairKey)) return;
        drawnPairs.add(pairKey);
        var predInfo = full.infoFor(predVis), succInfo = full.infoFor(succVis);
        if(!predInfo.scheduled || !succInfo.scheduled) return;
        var predY = HEADER_H + rowIndexById.get(predVis) * ROW_H + ROW_H/2;
        var succY = HEADER_H + rowIndexById.get(succVis) * ROW_H + ROW_H/2;
        var predEndX = PAD + (daysBetween(domainStart, predInfo.endDate) + 1) * pxPerDay;
        var startX = PAD + daysBetween(domainStart, succInfo.startDate) * pxPerDay;
        var midX = Math.max(predEndX + 8, startX - 8);
        svg += '<path d="M '+predEndX+' '+predY+' H '+midX+' V '+succY+' H '+(startX-2)+'" class="dep-line" marker-end="url(#arrow)"></path>';
      });
    });

    // bars / summary bars / milestones
    visRows.forEach(function(row, rowIdx){
      var t = row.task;
      var info = full.infoFor(t.id);
      var y = HEADER_H + rowIdx * ROW_H + 7;
      var barH = ROW_H - 14;
      var colorHex = effectiveColorHex(t, full.tasksById);
      var titleLines = [];
      if(t.responsible) titleLines.push('Responsável: '+t.responsible);
      if(p.showNotes && t.notes) titleLines.push('Observação: '+t.notes);
      var titleAttr = titleLines.length ? ('<title>'+esc(titleLines.join("\n"))+'</title>') : '';

      var rowCenterY = y + barH/2;
      var rowTop = HEADER_H + rowIdx * ROW_H;
      var rowBand = '<rect class="row-hover-band" x="0" y="'+rowTop+'" width="'+chartW+'" height="'+ROW_H+'"></rect>';
      var rowContent = '';

      if(!info.isGroup && info.duration === 0){
        var cx = PAD + daysBetween(domainStart, info.startDate) * pxPerDay + pxPerDay/2;
        var cy = y + barH/2;
        var done = (info.progress||0) >= 100;
        var paint = resolveMilestonePaint(colorHex, done);
        if(cx - 7 > 2){ rowContent += '<line x1="0" y1="'+rowCenterY+'" x2="'+(cx-7)+'" y2="'+rowCenterY+'" class="leader-line"></line>'; }
        rowContent += '<g>'+milestoneShapeSvg(t.milestoneIcon || "diamond", cx, cy, 7, paint)+titleAttr+'</g>';
        rowContent += '<text x="'+(cx+13)+'" y="'+(cy+1)+'" class="milestone-label">'+esc(t.name || "(sem nome)")+'</text>';
        rowContent += '<text x="'+(cx+13)+'" y="'+(cy+12)+'" class="milestone-date-label">'+fmtFull(info.endDate)+'</text>';
        svg += '<g class="gantt-row-g" data-task-id="'+t.id+'">'+rowBand+rowContent+'</g>';
        return;
      }

      var isGroupRow = info.isGroup;
      var effH = isGroupRow ? Math.round(barH*0.55) : barH;
      var by = y + (barH - effH)/2;
      var bx = PAD + daysBetween(domainStart, info.startDate) * pxPerDay + 2;
      var bw = Math.max((daysBetween(info.startDate, info.endDate) + 1) * pxPerDay - 4, 4);
      if(bx > 2){ rowContent += '<line x1="0" y1="'+rowCenterY+'" x2="'+bx+'" y2="'+rowCenterY+'" class="leader-line"></line>'; }
      var clipId = "clip-"+t.id.replace(/[^a-zA-Z0-9_-]/g,"");
      var progress = info.progress || 0;
      var pw = Math.max(bw * progress/100, 0);

      rowContent += '<clipPath id="'+clipId+'"><rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+effH+'" rx="3"></rect></clipPath>';

      var trackClass = colorHex ? "" : (isGroupRow ? "bar-track-group" : (t.atRisk ? "bar-track-risk" : "bar-track-normal"));
      var trackStyle = colorHex ? ('fill:'+hexToRgba(colorHex,0.22)+'; stroke:'+colorHex+'; stroke-width:1;') : "";
      rowContent += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+effH+'" rx="3" class="'+trackClass+'" style="'+trackStyle+'">'+titleAttr+'</rect>';

      if(pw > 0){
        var progClass = colorHex ? "" : (isGroupRow ? "bar-progress-group" : (t.atRisk ? "bar-progress-risk" : "bar-progress-normal"));
        var progStyle = colorHex ? ('fill:'+colorHex+';') : "";
        rowContent += '<rect x="'+bx+'" y="'+by+'" width="'+pw+'" height="'+effH+'" class="'+progClass+'" style="'+progStyle+'" clip-path="url(#'+clipId+')"></rect>';
      }
      if(t.atRisk){
        rowContent += '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+effH+'" class="hatch-overlay" clip-path="url(#'+clipId+')"></rect>';
      }
      if(bw > 26){
        var labelTxt = (isGroupRow || p.barLabelMode !== "duration") ? (progress+"%") : (info.duration+"d");
        rowContent += '<text x="'+(bx+bw+6)+'" y="'+(by+effH/2+3.5)+'" class="pct-label">'+labelTxt+'</text>';
      }
      svg += '<g class="gantt-row-g" data-task-id="'+t.id+'">'+rowBand+rowContent+'</g>';
    });

    var today = todayDate();
    var todayOffset = daysBetween(domainStart, today);
    if(todayOffset >= 0 && todayOffset <= totalDays){
      var tx = PAD + todayOffset * pxPerDay;
      svg += '<line x1="'+tx+'" y1="'+HEADER_H+'" x2="'+tx+'" y2="'+chartH+'" class="today-line"></line>';
      svg += '<text x="'+(tx+4)+'" y="11" class="today-label">HOJE</text>';
    }

    svg += '</svg>';

    var labelRows = visRows.map(function(row){
      var t = row.task;
      var info = full.infoFor(t.id);

  // ---------------- mutation helpers ----------------
  function markNotExample(p){ if(p.isExample) p.isExample = false; }

  function handleFieldChange(el){
    var field = el.getAttribute("data-field");
    var scope = el.getAttribute("data-scope");
    var proj = activeProject();
    if(!proj) return;
    if(scope === "project"){
      if(field === "name") proj.name = el.value.trim() || "Projeto sem nome";
      else if(field === "startDate") proj.startDate = el.value || toISO(todayDate());
      else if(field === "businessDaysOnly") proj.businessDaysOnly = el.checked;
      else if(field === "showResponsible") proj.showResponsible = el.checked;
      else if(field === "showPredecessors") proj.showPredecessors = el.checked;
      else if(field === "showNotes") proj.showNotes = el.checked;
      else if(field === "dueSoonEnabled") proj.dueSoonEnabled = el.checked;
      else if(field === "dueSoonDays"){
        var dv = Math.round(Number(el.value));
        if(isNaN(dv) || dv < 0) dv = 0;
        proj.dueSoonDays = dv;
      }
      else if(field === "replanEnabled") proj.replanEnabled = el.checked;
      markNotExample(proj);
      saveAndRender();
      return;
    }
    var taskId = el.getAttribute("data-task-id");
    var task = proj.tasks.filter(function(t){ return t.id === taskId; })[0];
    if(!task) return;
    ui.selectedTaskId = taskId;
    if(field === "name") task.name = el.value;
    else if(field === "responsible") task.responsible = el.value;
    else if(field === "notes") task.notes = el.value;
    else if(field === "duration"){
      var v = Math.round(Number(el.value));
      if(isNaN(v) || v < 0) v = 0;
      task.duration = v;
    } else if(field === "progress"){
      var pv = Math.round(Number(el.value));
      if(isNaN(pv)) pv = 0;
      task.progress = Math.min(100, Math.max(0, pv));
    } else if(field === "milestoneDone"){
      task.progress = el.checked ? 100 : 0;
    } else if(field === "startOverride"){
      var newStartIso = el.value || null;
      task.startOverride = newStartIso;
      markNotExample(proj);
      persist(); render();
      if(newStartIso){
        var fChk = computeFullSchedule(proj);
        var iChk = fChk.infoFor(task.id);
        if(iChk.scheduled && toISO(iChk.startDate) !== newStartIso){
          showToast("Data ajustada para "+fmtFull(iChk.startDate)+" — não é possível iniciar antes das predecessoras.");
        }
      }
      return;
    } else if(field === "endDateManual"){
      var newEndIso = el.value;
      if(newEndIso){
        var fEnd = computeFullSchedule(proj);
        var iEnd = fEnd.infoFor(task.id);
        if(iEnd.scheduled && !iEnd.isGroup){
          var seqEnd = fEnd.core.workingDates;
          var endIdx = indexOfDateOrAfter(seqEnd, parseISO(newEndIso));
          task.duration = Math.max(1, endIdx - iEnd.es + 1);
        }
      }
    }
    markNotExample(proj);
    saveAndRender();
  }

  // Commits a manually typed or pasted value from a date's plain-text field. The text field
  // itself carries no data-field/task-id — it's paired by DOM position with the real native
  // <input type="date"> (its ".date-native-input" sibling, shown alongside it as the calendar
  // picker) that already carries those attributes and feeds the existing handleFieldChange
  // logic, so parsing here just needs to set that input's value and dispatch "change" on it,
  // same as if the picker had been used.
  function handleDateTextChange(el){
    var wrap = el.closest(".date-field");
    var native = wrap ? wrap.querySelector(".date-native-input") : null;
    if(!native) return;
    var raw = el.value.trim();
    if(!raw){
      var fieldName = native.getAttribute("data-field");
      if(fieldName === "startOverride"){
        native.value = "";
        native.dispatchEvent(new Event("change", { bubbles:true }));
      } else {
        showToast("Data obrigatória. O campo foi restaurado.");
        render();
      }
      return;
    }
    var iso = parseFlexibleDate(raw);
    if(!iso){
      showToast("Data não reconhecida. Use o formato dd/mm/aaaa.");
      render();
      return;
    }
    native.value = iso;
    native.dispatchEvent(new Event("change", { bubbles:true }));
  }

  function closePopover(){ ui.popover = null; }

  root.addEventListener("focusin", function(e){
    var el = e.target.closest("[data-task-id]");
    if(el) ui.selectedTaskId = el.getAttribute("data-task-id");
  });

  root.addEventListener("change", function(e){
    var dateText = e.target.closest(".date-text-input");
    if(dateText){ handleDateTextChange(dateText); return; }
    var el = e.target.closest("[data-field]");
    if(el){ handleFieldChange(el); return; }
    var depToggle = e.target.closest('[data-action="toggle-dep"]');
    if(depToggle){
      var proj = activeProject();
      if(!proj) return;
      var ownerId = depToggle.getAttribute("data-task-id");
      var depId = depToggle.getAttribute("data-dep-id");
      var owner = proj.tasks.filter(function(t){ return t.id === ownerId; })[0];
      if(!owner) return;
      owner.deps = owner.deps || [];
      var i = owner.deps.indexOf(depId);
      if(depToggle.checked && i === -1) owner.deps.push(depId);
      else if(!depToggle.checked && i !== -1) owner.deps.splice(i, 1);
      markNotExample(proj);
      saveAndRender();
      return;
    }
    var selectToggle = e.target.closest('[data-action="toggle-select-task"]');
    if(selectToggle){
      var stId = selectToggle.getAttribute("data-id");
      if(selectToggle.checked) ui.bulkSelectedIds.add(stId);
      else ui.bulkSelectedIds.delete(stId);
      render();
      return;
    }
    var selectGroupToggle = e.target.closest('[data-action="toggle-select-group"]');
    if(selectGroupToggle){
      var sgProj = activeProject();
      if(sgProj){
        var sgChildrenMap = buildChildrenMap(sgProj.tasks);
        var sgLeafIds = leafDescendants(selectGroupToggle.getAttribute("data-id"), sgChildrenMap);
        if(selectGroupToggle.checked) sgLeafIds.forEach(function(id){ ui.bulkSelectedIds.add(id); });
        else sgLeafIds.forEach(function(id){ ui.bulkSelectedIds.delete(id); });
      }
      render();
      return;
    }
    var selectAllToggle = e.target.closest('[data-action="toggle-select-all-tasks"]');
    if(selectAllToggle){
      var projSA = activeProject();
      if(projSA){
        var rowsSA2 = buildDisplayRows(projSA);
        var fullSA2 = computeFullSchedule(projSA);
        var selectableSA2 = rowsSA2.filter(function(r){ return !fullSA2.isGroup(r.task.id); }).map(function(r){ return r.task.id; });
        if(selectAllToggle.checked) selectableSA2.forEach(function(id){ ui.bulkSelectedIds.add(id); });
        else selectableSA2.forEach(function(id){ ui.bulkSelectedIds.delete(id); });
      }
      render();
      return;
    }
  });

  root.addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.matches(".name-input, .dur-input, .title-input, .responsible-input, .notes-input, .progress-input, .date-text-input")){
      e.target.blur();

  root.addEventListener("input", function(e){

      applyProjectFilter();
    }

  // Drag-to-resize for the Gantt activity-name column. Mutates the grid's column width
  // directly during the drag for smooth feedback (no full re-render mid-drag), and only
  // persists the final width — and re-renders once — on mouseup.
  root.addEventListener("mousedown", function(e){
    var handle = e.target.closest('[data-action="resize-gantt-labels"]');
    if(!handle) return;
    var proj = activeProject();
    if(!proj) return;
    e.preventDefault();
    var startX = e.clientX;
    var startWidth = proj.ganttLabelWidth || 220;
    var grid = handle.closest(".gantt-grid");
    function onMove(evMove){
      var next = Math.max(100, Math.min(560, startWidth + (evMove.clientX - startX)));
      if(grid) grid.style.gridTemplateColumns = next+"px 1fr";
    }
    function onUp(evUp){
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      var finalWidth = Math.max(100, Math.min(560, startWidth + (evUp.clientX - startX)));
      proj.ganttLabelWidth = finalWidth;
      markNotExample(proj);
      saveAndRender();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  // Hover sync between a Gantt row's label and its bar: both carry a matching
  // data-task-id, so a lightweight class toggle (no re-render) highlights both.
  var ganttHoverIds = [];
  function clearGanttHover(){
    ganttHoverIds.forEach(function(id){
      root.querySelectorAll('.gantt-panel [data-task-id="'+id+'"]').forEach(function(el){ el.classList.remove("gantt-hover"); });
    });
    ganttHoverIds = [];
  }
  function setGanttHover(id){
    root.querySelectorAll('.gantt-panel [data-task-id="'+id+'"]').forEach(function(el){ el.classList.add("gantt-hover"); });
    ganttHoverIds = [id];
  }
  var lastGanttHoverId = null;
  root.addEventListener("mouseover", function(e){
    var el = e.target.closest(".gantt-panel [data-task-id]");
    var id = el ? el.getAttribute("data-task-id") : null;
    if(id === lastGanttHoverId) return;
    clearGanttHover();
    lastGanttHoverId = id;
    if(id) setGanttHover(id);
  });
  root.addEventListener("mouseout", function(e){
    var to = e.relatedTarget;
    if(to && to.closest && to.closest(".gantt-panel [data-task-id]")) return;
    clearGanttHover();
    lastGanttHoverId = null;
  });

  root.addEventListener("click", function(e){
    var rowEl = e.target.closest("tr[data-row-id]");
    if(rowEl && !e.target.closest("input,button,textarea,select,label")){
      ui.selectedTaskId = rowEl.getAttribute("data-row-id");
      render();
      return;
    }

    var actionEl = e.target.closest("[data-action]");
    if(!actionEl){
      if(ui.popover && !e.target.closest(".dep-menu")){ closePopover(); render(); }
      return;
    }
    var action = actionEl.getAttribute("data-action");
    var proj = activeProject();

    if(action === "select-project"){
      state.activeId = actionEl.getAttribute("data-id");
      ui.selectedTaskId = null;
      ui.bulkSelectedIds.clear();
      closePopover();
      saveAndRender();
      return;
    }
    if(action === "toggle-sidebar"){
      state.sidebarCollapsed = !state.sidebarCollapsed;
      persist();
      render();
      return;
    }
    if(action === "toggle-pin-project"){
      var pinId = actionEl.getAttribute("data-id");
      var pinProj = state.projects.filter(function(pp){ return pp.id === pinId; })[0];
      if(pinProj){ pinProj.pinned = !pinProj.pinned; saveAndRender(); }
      return;
    }
    if(action === "new-project"){
      var np = { id:genId(), name:"Novo projeto", startDate: toISO(todayDate()), businessDaysOnly:true, showResponsible:false, showPredecessors:true, showNotes:false, pinned:false, dueSoonEnabled:false, dueSoonDays:3, replanEnabled:false, barLabelMode:"percent", ganttScale:"weeks", ganttZoom:1, ganttLabelWidth:220, isExample:false, tasks:[] };
      state.projects.push(np);
      state.activeId = np.id;
      ui.selectedTaskId = null;
      saveAndRender();
      return;
    }
    if(action === "delete-project"){
      var pid = actionEl.getAttribute("data-id");
      if(ui.pendingDelete && ui.pendingDelete.kind === "project" && ui.pendingDelete.id === pid){
        state.projects = state.projects.filter(function(p){ return p.id !== pid; });
        if(state.activeId === pid) state.activeId = state.projects.length ? state.projects[0].id : null;
        ui.pendingDelete = null;
        if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
        saveAndRender();
      } else {
        ui.pendingDelete = { kind:"project", id:pid };
        if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
        pendingDeleteTimer = setTimeout(function(){ ui.pendingDelete = null; render(); }, 3000);
        render();
      }
      return;
    }
    if(action === "add-task"){
      if(!proj) return;
      var newTask = defaultTask({});
      var selTask = ui.selectedTaskId ? proj.tasks.filter(function(t){ return t.id === ui.selectedTaskId; })[0] : null;
      if(selTask){
        newTask.parentId = selTask.parentId || null;
        proj.tasks.push(newTask);
        relocateSubtreeAfter(proj.tasks, newTask.id, selTask.id);
      } else {
        proj.tasks.push(newTask);
      }
      ui.selectedTaskId = newTask.id;
      ui.focusNextId = newTask.id;
      markNotExample(proj);
      saveAndRender();
      return;
    }
    if(action === "add-subtask"){
      if(!proj) return;
      var parentId = actionEl.getAttribute("data-id");
      var parent = proj.tasks.filter(function(t){ return t.id === parentId; })[0];
      if(!parent) return;
      var childTask = defaultTask({ parentId:parentId });
      proj.tasks.push(childTask);
      parent.collapsed = false;
      ui.selectedTaskId = childTask.id;
      ui.focusNextId = childTask.id;
      markNotExample(proj);
      saveAndRender();
      return;
    }
    if(action === "indent-task"){
      if(!proj) return;
      var idT = actionEl.getAttribute("data-id");
      if(indentTask(proj, idT)){ markNotExample(proj); ui.selectedTaskId = idT; saveAndRender(); }
      return;
    }
    if(action === "outdent-task"){
      if(!proj) return;
      var idT2 = actionEl.getAttribute("data-id");
      if(outdentTask(proj, idT2)){ markNotExample(proj); ui.selectedTaskId = idT2; saveAndRender(); }
      return;
    }
    if(action === "move-up" || action === "move-down"){
      if(!proj) return;
      var idT3 = actionEl.getAttribute("data-id");
      if(moveTask(proj, idT3, action === "move-up" ? -1 : 1)){ ui.selectedTaskId = idT3; saveAndRender(); }

    if(action === "dur-step"){
      if(!proj) return;
      var idDS = actionEl.getAttribute("data-id");

      var tDS = proj.tasks.filter(function(t){ return t.id === idDS; })[0];
      if(tDS){
        var nv = (tDS.duration||0) + (dir === "up" ? 1 : -1);
        if(nv < 0) nv = 0;
        tDS.duration = nv;
        markNotExample(proj);

      if(!proj) return;
      var idAR = actionEl.getAttribute("data-id");

    if(action === "accept-baseline"){
      if(!proj) return;

        if(infoAB.scheduled){
          tAB.baselineStart = toISO(infoAB.startDate);
          tAB.baselineEnd = toISO(infoAB.endDate);
          tAB.lastSeenStart = tAB.baselineStart;
          tAB.lastSeenEnd = tAB.baselineEnd;

          t.progress = 100;
          doneCount++;
        }
      });
      ui.bulkSelectedIds.clear();
      if(doneCount){
        markNotExample(proj);
        persist();
        showToast(doneCount === 1 ? "1 atividade concluída." : (doneCount + " atividades concluídas."));
      } else {
        render();
      }
      return;
    }
    if(action === "clear-selection"){
      ui.bulkSelectedIds.clear();
      render();
      return;
    }
    if(action === "clear-start-override"){
      if(!proj) return;
      var idCS = actionEl.getAttribute("data-id");

      var mid = actionEl.getAttribute("data-id");

      if(mtask){ mtask.duration = 0; markNotExample(proj); saveAndRender(); }

      if(!proj) return;
      var uid = actionEl.getAttribute("data-id");
      var utask = proj.tasks.filter(function(t){ return t.id === uid; })[0];
      if(utask){ utask.duration = 1; markNotExample(proj); saveAndRender(); }
      return;

    if(action === "open-milestone-menu"){
      var rect3 = actionEl.getBoundingClientRect();
      var left3 = Math.min(rect3.left, window.innerWidth - 206);
      ui.popover = { type:"milestoneIcon", taskId: actionEl.getAttribute("data-task-id"), pos:{ top: rect3.bottom + 6, left: Math.max(left3, 8) } };
      render();
      return;
    }
    if(action === "set-milestone-icon"){
      var ownerId3 = actionEl.getAttribute("data-task-id");
      var iconKey = actionEl.getAttribute("data-icon");
      var ownerT3 = proj.tasks.filter(function(t){ return t.id === ownerId3; })[0];
      if(ownerT3){ ownerT3.milestoneIcon = iconKey; markNotExample(proj); }
      closePopover();
      saveAndRender();

    if(action === "delete-task"){
      var tid = actionEl.getAttribute("data-id");
      if(ui.pendingDelete && ui.pendingDelete.kind === "task" && ui.pendingDelete.id === tid){

        var toDelete = new Set([tid].concat(allDescendantIds(tid, childrenMap)));
        proj.tasks = proj.tasks.filter(function(t){ return !toDelete.has(t.id); });
        proj.tasks.forEach(function(t){ t.deps = (t.deps||[]).filter(function(d){ return !toDelete.has(d); }); });
        if(toDelete.has(ui.selectedTaskId)) ui.selectedTaskId = null;
        markNotExample(proj);
        ui.pendingDelete = null;
        if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
        saveAndRender();
      } else {
        ui.pendingDelete = { kind:"task", id:tid };
        if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
        pendingDeleteTimer = setTimeout(function(){ ui.pendingDelete = null; render(); }, 3000);
        render();
      }
      return;
    }
    if(action === "add-dep"){
      var rect = actionEl.getBoundingClientRect();
      var left = Math.min(rect.left, window.innerWidth - 252);
      ui.popover = { type:"dep", taskId: actionEl.getAttribute("data-task-id"), pos:{ top: rect.bottom + 6, left: Math.max(left, 8) } };
      render();
      return;
    }
    if(action === "open-color-menu"){
      var rect2 = actionEl.getBoundingClientRect();
      var left2 = Math.min(rect2.left, window.innerWidth - 210);
      ui.popover = { type:"color", taskId: actionEl.getAttribute("data-task-id"), pos:{ top: rect2.bottom + 6, left: Math.max(left2, 8) } };
      render();
      return;
    }
    if(action === "set-color"){
      var ownerId2 = actionEl.getAttribute("data-task-id");
      var colorKey = actionEl.getAttribute("data-color");
      var ownerT = proj.tasks.filter(function(t){ return t.id === ownerId2; })[0];
      if(ownerT){ ownerT.color = colorKey || null; markNotExample(proj); }
      closePopover();
      saveAndRender();
      return;
    }
    if(action === "close-popover"){ closePopover(); render(); return; }
    if(action === "remove-dep"){
      var ownerId = actionEl.getAttribute("data-task-id");
      var depId = actionEl.getAttribute("data-dep-id");
      var owner = proj.tasks.filter(function(t){ return t.id === ownerId; })[0];
      if(owner){ owner.deps = (owner.deps||[]).filter(function(d){ return d !== depId; }); markNotExample(proj); saveAndRender(); }
      return;
    }
    if(action === "set-scale"){
      if(!proj) return;
      proj.ganttScale = actionEl.getAttribute("data-mode");
      saveAndRender();
      return;
    }
    if(action === "set-bar-label"){
      if(!proj) return;
      proj.barLabelMode = actionEl.getAttribute("data-mode");
      saveAndRender();
      return;
    }
    if(action === "gantt-zoom"){
      if(!proj) return;
      var dir = actionEl.getAttribute("data-dir");
      var z = proj.ganttZoom || 1;
      if(dir === "in") z = Math.min(3, +(z*1.2).toFixed(2));
      else if(dir === "out") z = Math.max(0.3, +(z/1.2).toFixed(2));
      else if(dir === "reset") z = 1;
      else if(dir === "fit"){
        var fullFit = computeFullSchedule(proj);
        var totalDaysFit = Math.max(daysBetween(fullFit.core.projectStartDate, fullFit.core.projectEndDate) + 1, 1);
        var baseFit = basePxPerDayFor(totalDaysFit);
        var scrollEl = root.querySelector(".gantt-scroll");
        var labelWFit = proj.ganttLabelWidth || 220;
        var avail = scrollEl ? scrollEl.clientWidth : 900;
        var availForChart = Math.max(200, avail - labelWFit);
        var neededPxPerDay = Math.max(4, (availForChart - 10*2 - 170) / totalDaysFit);
        z = Math.max(0.3, Math.min(3, +(neededPxPerDay / baseFit).toFixed(2)));
      }
      proj.ganttZoom = z;
      markNotExample(proj);
      saveAndRender();
      return;
    }
    if(action === "export-excel"){ exportExcel(); return; }
    if(action === "export-png"){ exportPng(); return; }
    if(action === "copy-backup"){
      var text = JSON.stringify(state, null, 2);
      var done = function(){ showToast("Backup copiado para a área de transferência."); };
      var fail = function(){
        try{
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          done();
        }catch(err){ showToast("Não foi possível copiar automaticamente."); }
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
      return;
    }
    if(action === "open-restore"){ ui.showRestore = true; ui.restoreText = ""; ui.restoreError = null; render(); return; }
    if(action === "close-restore" || action === "overlay-restore"){ ui.showRestore = false; render(); return; }
    if(action === "apply-restore"){
      var ta2 = document.getElementById("restoreTextarea");
      var raw = ta2 ? ta2.value : "";
      ui.restoreText = raw;
      try{
        var parsed = JSON.parse(raw);
        var normalized = normalizeState(parsed);
        state = normalized;
        ui.showRestore = false;
        ui.restoreError = null;
        ui.selectedTaskId = null;
        persist();
        showToast("Backup restaurado.");
        render();
      }catch(err){
        ui.restoreError = "JSON inválido. Verifique o texto colado e tente novamente.";
        render();
      }
      return;
    }
    if(action === "open-quickadd"){
      ui.showQuickAdd = true; ui.quickAddText = ""; ui.quickAddError = null; ui.focusQuickAdd = true; render(); return;
    }
    if(action === "close-quickadd" || action === "overlay-quickadd"){ ui.showQuickAdd = false; render(); return; }
    if(action === "apply-quickadd"){
      var projQA = activeProject();
      if(!projQA) return;
      var taQA = document.getElementById("quickAddTextarea");
      var rawQA = taQA ? taQA.value : "";
      ui.quickAddText = rawQA;
      var lines = rawQA.split(/\r?\n/);
      var stack = [];
      var addedIds = [];
      lines.forEach(function(line){
        if(!line.trim()) return;
        var indentWs = line.match(/^[ \t]*/)[0].replace(/\t/g, "  ");
        var depth = Math.floor(indentWs.length / 2);
        while(stack.length && stack[stack.length-1].depth >= depth) stack.pop();
        var parentId = stack.length ? stack[stack.length-1].id : null;
        var newTaskQA = defaultTask({ name: line.trim(), parentId: parentId });
        projQA.tasks.push(newTaskQA);
        addedIds.push(newTaskQA.id);
        stack.push({ depth: depth, id: newTaskQA.id });
      });
      if(addedIds.length){
        markNotExample(projQA);
        ui.selectedTaskId = addedIds[addedIds.length - 1];
        ui.showQuickAdd = false;
        ui.quickAddText = "";
        ui.quickAddError = null;
        persist();
        showToast(addedIds.length === 1 ? "1 atividade adicionada." : (addedIds.length + " atividades adicionadas."));
      } else {
        ui.quickAddError = "Digite ao menos um nome de atividade.";
        render();
      }
      return;
    }
  });

  render();
})();
</script>
