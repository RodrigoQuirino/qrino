<meta charset="UTF-8">
<title>Easy Timeline</title>
<script defer src="https://analytics.zedascompras.com.br/script.js" data-website-id="88516fd5-5736-4986-b884-eaa9d7d9b2c9"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#1F2933;
    --ink-soft:#5C6570;
    --paper:#F3F2EC;
    --paper-raised:#FBFAF6;
    --line:#C9C4B8;
    --line-strong:#A9A392;
    --blue:#2A5C8A;
    --blue-soft:#DCE7EF;
    --rust:#B5502D;
    --rust-soft:#F3E1D8;
    --sage:#5B7A6B;
    --sage-soft:#E1E9E4;
    --amber:#966915;
    --amber-soft:#F5E9C8;
    --shadow:rgba(31,41,51,.14);
    --focus:#2A5C8A;
    --weekend:rgba(31,41,51,.06);
    --select-bg:rgba(42,92,138,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECE9E1;
      --ink-soft:#A9AFB6;
      --paper:#14181C;
      --paper-raised:#1B2126;
      --line:#333A40;
      --line-strong:#4A525A;
      --blue:#7BB0DB;
      --blue-soft:#20323E;
      --rust:#E08A5B;
      --rust-soft:#3B2A22;
      --sage:#8FB39E;
      --sage-soft:#20302A;
      --amber:#D9AE55;
      --amber-soft:#3A3016;
      --shadow:rgba(0,0,0,.5);
      --focus:#7BB0DB;
      --weekend:rgba(255,255,255,.05);
      --select-bg:rgba(123,176,219,.14);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECE9E1;
    --ink-soft:#A9AFB6;
    --paper:#14181C;
    --paper-raised:#1B2126;
    --line:#333A40;
    --line-strong:#4A525A;
    --blue:#7BB0DB;
    --blue-soft:#20323E;
    --rust:#E08A5B;
    --rust-soft:#3B2A22;
    --sage:#8FB39E;
    --sage-soft:#20302A;
    --amber:#D9AE55;
    --amber-soft:#3A3016;
    --shadow:rgba(0,0,0,.5);
    --focus:#7BB0DB;
    --weekend:rgba(255,255,255,.05);
    --select-bg:rgba(123,176,219,.14);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{background:var(--paper); color:var(--ink);}
  .app, .app *{font-family:'IBM Plex Sans', system-ui, sans-serif;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .display{font-family:'Big Shoulders', 'IBM Plex Sans', sans-serif;}

  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .app{
    display:grid;
    grid-template-columns: 232px 1fr;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--paper-raised);
    border-right:1px solid var(--line);
    padding:22px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
    min-height:100vh;
  }
  .sidebar-top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-mark{font-weight:800; font-size:1.7rem; letter-spacing:.01em; line-height:1;}
  .brand-sub{color:var(--ink-soft); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;}
  .ruler{
    height:1px;
    background:var(--line);
    margin-top:2px;
  }
  .sidebar-collapse-btn{
    background:none; border:1px solid transparent; color:var(--ink-soft); cursor:pointer; font-size:1rem;
    line-height:1; padding:4px 7px; border-radius:6px; flex-shrink:0;
  }
  .sidebar-collapse-btn:hover{background:var(--blue-soft); color:var(--blue);}
  .sidebar-expand-btn{
    position:fixed; top:18px; left:14px; z-index:50; width:34px; height:34px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:0 2px 6px var(--shadow);
  }
  .sidebar-expand-btn:hover{color:var(--blue); border-color:var(--blue);}
  .app.is-sidebar-collapsed{grid-template-columns:1fr;}
  .app.is-sidebar-collapsed .main{padding-left:64px;}
  .app.is-sidebar-collapsed .sidebar{display:none;}
  .sidebar-search{
    width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-size:.82rem; font-family:'IBM Plex Sans', sans-serif;
  }
  .sidebar-search:focus{border-color:var(--blue); outline:none;}
  .project-list-divider{border-top:1px solid var(--line); margin:2px 4px 4px;}
  .project-search-empty{padding:2px 2px 0;}
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.82rem;
    font-weight:600;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    line-height:1.2;
    box-shadow:0 1px 2px var(--shadow);
    transition:border-color .12s, box-shadow .12s, filter .12s, background .12s;
  }
  .btn:hover{border-color:var(--line-strong); box-shadow:0 2px 6px var(--shadow);}
  .btn:active{box-shadow:none; filter:brightness(0.98);}
  .btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:none;}
  .btn-primary{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent; background:transparent; box-shadow:none;}
  .btn-ghost:hover{background:var(--blue-soft); box-shadow:none;}
  .btn-danger{color:var(--rust); border-color:var(--rust);}
  .btn-sm{font-size:.76rem; padding:6px 10px; border-radius:7px;}
  .btn-block{width:100%; justify-content:center;}

  .project-list{display:flex; flex-direction:column; gap:6px; overflow-y:auto; flex:1;}
  .project-item{
    position:relative;
    border:1px solid transparent;
    border-radius:8px;
    padding:9px 10px 9px 14px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:2px;
    transition:background .12s;
  }
  .project-item::before{
    content:"";
    position:absolute; left:0; top:6px; bottom:6px; width:3px; border-radius:2px;
    background:transparent;
  }
  .project-item:hover{background:var(--blue-soft);}
  .project-item.active{background:var(--blue-soft); border-color:var(--line);}
  .project-item.active::before{background:var(--blue);}
  .project-item-top{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .project-name-wrap{display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden;}
  .project-name{font-weight:600; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .project-overdue-flag{
    flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; border-radius:50%; background:var(--rust); color:#fff;
    font-size:.68rem; font-weight:800; font-family:'IBM Plex Sans', sans-serif; line-height:1; cursor:default;
  }
  .project-meta{color:var(--ink-soft); font-size:.72rem;}
  .example-tag{
    display:inline-block; font-size:.62rem; letter-spacing:.06em; text-transform:uppercase;
    background:var(--sage-soft); color:var(--sage); padding:1px 6px; border-radius:3px; margin-top:2px; width:fit-content;
  }
  .project-item-actions{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .project-item .icon-btn{opacity:0; transition:opacity .12s;}
  .project-item:hover .icon-btn, .project-item.active .icon-btn{opacity:1;}
  .project-item .pin-btn.is-pinned{opacity:1;}
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:2px 4px; border-radius:4px; font-size:.75rem;
  }
  .icon-btn:hover{background:var(--paper); color:var(--rust);}
  .pin-btn{font-size:.82rem;}
  .pin-btn.is-pinned{color:var(--amber);}
  .pin-btn.is-pinned:hover{color:var(--amber);}

  .sidebar-foot{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:12px;}
  .storage-note{color:var(--ink-soft); font-size:.68rem; line-height:1.4;}

  /* ---------- main ---------- */
  .main{padding:26px 24px 40px; display:flex; flex-direction:column; gap:22px; max-width:1680px; min-width:0;}
  .empty-state{color:var(--ink-soft); padding:60px 10px; text-align:center; font-size:.95rem;}

  .project-header{display:flex; flex-direction:column; gap:14px;}
  .title-input{
    font-family:'Big Shoulders', sans-serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:.01em;
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--ink);
    padding:2px 1px 4px;
    width:100%;
    max-width:100%;
  }
  .title-input:hover{border-bottom-color:var(--line);}
  .title-input:focus{border-bottom-color:var(--blue);}

  .meta-row{display:flex; align-items:center; gap:22px; flex-wrap:wrap; font-size:.84rem;}
  .field{display:flex; align-items:center; gap:8px;}
  .field label{color:var(--ink-soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;}
  .toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .toggle input{position:absolute; opacity:0; width:1px; height:1px;}
  .toggle-track{width:34px; height:19px; border-radius:10px; background:var(--line); position:relative; transition:background .15s; flex-shrink:0;}
  .toggle-thumb{position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:var(--paper-raised); transition:left .15s; box-shadow:0 1px 2px var(--shadow);}
  .toggle input:checked + .toggle-track{background:var(--blue);}
  .toggle input:checked + .toggle-track .toggle-thumb{left:17px;}
  .toggle input:focus-visible + .toggle-track{outline:2px solid var(--focus); outline-offset:2px;}
  .toggle-label{font-size:.82rem; color:var(--ink);}

  .summary-pill{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; color:var(--ink-soft);
    background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; padding:6px 14px;
  }
  .summary-pill b{color:var(--ink); font-weight:600;}

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--rust-soft); border:1px solid var(--rust); color:var(--rust);
    border-radius:10px; padding:10px 14px; font-size:.84rem; line-height:1.5;
  }
  .banner strong{display:block; font-size:.84rem;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .toolbar-left{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .toolbar-right{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  /* ---------- table ---------- */
  .table-wrap{border:1px solid var(--line); border-radius:12px; overflow:auto; background:var(--paper-raised); box-shadow:0 1px 3px var(--shadow); min-width:0;}
  table.task-table{border-collapse:collapse; width:100%; min-width:1100px;}
  .task-table thead th{
    position:sticky; top:0; background:var(--paper-raised); z-index:2;
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);
    font-weight:600; padding:10px 10px; border-bottom:1px solid var(--line);
  }
  .task-table td{padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:.86rem;}
  .task-table tbody tr:last-child td{border-bottom:none;}
  .task-table tbody tr.is-at-risk{background:color-mix(in srgb, var(--rust-soft) 45%, transparent);}
  .task-table tbody tr.is-unscheduled{background:color-mix(in srgb, var(--rust-soft) 70%, transparent);}
  .task-table tbody tr.is-group-row td{font-weight:600; border-bottom:1px solid var(--line-strong);}
  .task-table tbody tr.is-selected td{background:var(--select-bg); box-shadow:inset 2px 0 0 var(--blue);}
  .task-table thead th:last-child{position:sticky; right:0; z-index:3; box-shadow:-6px 0 6px -6px var(--shadow);}
  .task-table tbody td:last-child{
    position:sticky; right:0; z-index:1; background:var(--paper-raised);
    box-shadow:-6px 0 6px -6px var(--shadow);
  }
  .task-table tbody tr.is-at-risk td:last-child{background:color-mix(in srgb, var(--rust-soft) 45%, var(--paper-raised));}
  .task-table tbody tr.is-unscheduled td:last-child{background:color-mix(in srgb, var(--rust-soft) 70%, var(--paper-raised));}
  .task-table tbody tr.is-selected td:last-child{background:var(--select-bg);}
  .code-cell{font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); white-space:nowrap;}
  .code-cell-inner{display:inline-flex; align-items:center;}
  .row-select-checkbox{width:13px; height:13px; margin:0 6px 0 0; flex-shrink:0; cursor:pointer; accent-color:var(--blue);}
  .row-select-spacer{display:inline-block; width:13px; margin-right:6px; flex-shrink:0;}
  .select-all-label{display:inline-flex; align-items:center; gap:5px; cursor:pointer;}
  .select-all-label input{width:13px; height:13px; margin:0; cursor:pointer; accent-color:var(--blue);}
  .bulk-bar{display:inline-flex; align-items:center; gap:8px; background:var(--blue-soft); border:1px solid var(--blue); border-radius:8px; padding:5px 6px 5px 12px;}
  .bulk-count{font-size:.8rem; color:var(--blue); font-weight:600; white-space:nowrap;}
  .risk-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--rust); margin-right:5px; flex-shrink:0;}
  .replan-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:14px; padding:0 3px;
    border-radius:7px; background:var(--blue-soft); color:var(--blue); font-size:.64rem; font-weight:700;
    margin-right:5px; flex-shrink:0; font-family:'IBM Plex Mono', monospace; line-height:1; cursor:default;
  }
  .name-cell{display:flex; align-items:center; gap:4px;}
  .tree-toggle{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1.05rem; line-height:1; width:20px; flex-shrink:0; padding:0; text-align:center;}
  .tree-toggle:hover{color:var(--blue);}
  .tree-spacer{display:inline-block; width:20px; flex-shrink:0;}
  .date-flag-wrap{display:flex; align-items:center; gap:4px; min-width:0;}
  .due-flag{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; line-height:1;}
  .due-flag-overdue{width:14px; height:14px; border-radius:50%; background:var(--rust); color:#fff; font-size:.68rem; font-weight:800; font-family:'IBM Plex Sans', sans-serif;}
  .due-flag-soon{width:7px; height:7px; border-radius:50%; background:var(--amber); opacity:.85;}
  .date-text.is-overdue{color:var(--rust); font-weight:700;}
  .color-dot{width:14px; height:14px; border-radius:50%; border:1.5px dashed var(--line-strong); background:transparent; cursor:pointer; flex-shrink:0; padding:0;}
  .color-dot.has-color{border-style:dashed;}
  .color-dot.is-own{border-style:solid;}
  .name-input{
    width:100%; min-width:170px; background:transparent; border:1px solid transparent; border-radius:4px;
    padding:5px 6px; font-size:.86rem; font-weight:inherit; color:var(--ink);
  }
  .name-input:hover{border-color:var(--line);}
  .name-input:focus{border-color:var(--blue); background:var(--paper);}
  .responsible-input{
    width:100%; min-width:82px; background:transparent; border:1px solid transparent; border-radius:4px;
    padding:5px 6px; font-size:.84rem; color:var(--ink);
  }
  .responsible-input:hover{border-color:var(--line);}
  .responsible-input:focus{border-color:var(--blue); background:var(--paper);}
  .notes-input{
    width:100%; min-width:110px; background:transparent; border:1px solid transparent; border-radius:4px;
    padding:5px 6px; font-size:.84rem; color:var(--ink);
  }
  .notes-input:hover{border-color:var(--line);}
  .notes-input:focus{border-color:var(--blue); background:var(--paper);}
  .dur-cell{display:flex; align-items:center; gap:2px;}
  .dur-input{
    width:44px; background:transparent; border:1px solid transparent; border-radius:4px; padding:5px 4px;
    font-family:'IBM Plex Mono', monospace; color:var(--ink); text-align:right;
  }
  .dur-input:hover{border-color:var(--line);}
  .dur-input:focus{border-color:var(--blue); background:var(--paper);}
  .dur-unit{color:var(--ink-soft); font-size:.76rem; margin-left:2px; margin-right:2px;}
  .dur-input::-webkit-inner-spin-button, .dur-input::-webkit-outer-spin-button,
  .progress-input::-webkit-inner-spin-button, .progress-input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .dur-input, .progress-input{-moz-appearance:textfield;}
  .dur-readout{color:var(--ink); font-size:.86rem;}
  .stepper{display:inline-flex; flex-direction:column; margin-right:2px; flex-shrink:0;}
  .stepper-btn{
    width:15px; height:10px; line-height:1; font-size:.5rem; padding:0; margin:0;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper-btn:first-child{border-radius:3px 3px 0 0; border-bottom:none;}
  .stepper-btn:last-child{border-radius:0 0 3px 3px;}
  .stepper-btn:hover{background:var(--blue-soft); color:var(--blue); border-color:var(--blue);}
  .date-edit{display:flex; align-items:center; gap:2px;}
  .date-input{
    background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 2px;
    font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--ink); width:108px; cursor:pointer;
  }
  .date-input:hover{border-color:var(--line); background:var(--paper);}
  .date-input:focus{border-color:var(--blue); background:var(--paper); cursor:auto;}
  .date-input.is-overdue{color:var(--rust); font-weight:700;}
  .date-clear-btn{
    background:none; border:none; color:var(--blue); cursor:pointer; font-size:.85rem; line-height:1;
    padding:2px; border-radius:4px; flex-shrink:0;
  }
  .date-clear-btn:hover{background:var(--blue-soft);}
  /* Manual date entry: a plain text field (typeable, pasteable, copyable) sits next to the
     real native <input type="date"> for picking visually. Native date-input segmented
     editors are unreliable to type into directly and block copy/paste, so the visible
     control for editing is always plain text — but the calendar picker itself has to be a
     genuine, directly-clickable native date input (not a hidden proxy opened via
     showPicker(), which isn't reliably available inside the sandboxed frame an Artifact
     renders in). Shrinking that native input down and hiding its own text via the
     -webkit-datetime-edit pseudo-element leaves just its built-in calendar icon, so it reads
     as a small calendar button in Chromium browsers; other browsers fall back to a narrow
     (but still fully functional) native date field. */
  .date-field{display:inline-flex; align-items:center; gap:2px;}
  .date-text-input{width:88px; cursor:text;}
  .date-text-input:hover{cursor:text;}
  .date-native-input{width:22px; min-width:22px; padding:5px 0; text-align:center;}
  .date-native-input::-webkit-datetime-edit{display:none;}
  .date-native-input::-webkit-inner-spin-button{display:none;}
  .date-native-input::-webkit-calendar-picker-indicator{opacity:.65; cursor:pointer;}
  .date-native-input:hover::-webkit-calendar-picker-indicator, .date-native-input:focus::-webkit-calendar-picker-indicator{opacity:1;}
  .milestone-toggle-btn{
    width:20px; height:20px; border:1px solid var(--line); border-radius:4px; background:none; color:var(--ink-soft);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:.72rem; flex-shrink:0; padding:0;
  }
  .milestone-toggle-btn:hover{border-color:var(--blue); color:var(--blue);}
  .milestone-cell{display:flex; align-items:center; gap:4px;}
  .milestone-icon-btn{
    width:24px; height:24px; border:1px solid var(--line); border-radius:5px; background:var(--paper);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;
  }
  .milestone-icon-btn:hover{border-color:var(--blue);}
  .deps-cell{display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-width:110px;}
  .chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--blue-soft); color:var(--blue);
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; padding:2px 4px 2px 8px; border-radius:4px;
  }
  .chip button{background:none; border:none; color:inherit; cursor:pointer; font-size:.85rem; line-height:1; padding:0 2px;}
  .add-dep-btn{
    width:22px; height:22px; border-radius:50%; border:1px dashed var(--line-strong); background:none;
    color:var(--ink-soft); cursor:pointer; font-size:.85rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .add-dep-btn:hover{border-color:var(--blue); color:var(--blue);}
  .date-cell{font-family:'IBM Plex Mono', monospace; font-size:.82rem; white-space:nowrap;}
  .dash{color:var(--ink-soft);}
  .dash-muted{color:var(--ink-soft); font-size:.78rem; white-space:nowrap;}
  .row-actions{display:flex; align-items:center; justify-content:flex-end; gap:5px;}
  .row-actions-left{display:flex; align-items:center; gap:2px; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:2px;}
  .row-icon-btn{

  function expandDepsForLeaf(task, tasksById, childrenMap){
    var raw = task.deps || [];
    var out = [];
    raw.forEach(function(depId){
      if(depId === task.id) return;
      if(!tasksById.has(depId)) return;
      if(isGroupTask(depId, childrenMap)){
        leafDescendants(depId, childrenMap).forEach(function(lid){ if(lid !== task.id) out.push(lid); });
      } else {
        out.push(depId);
      }
    });
    return Array.from(new Set(out));
  }

  // ---------------- display order (pure hierarchy + array order, no auto-sorting) ----------------
  function buildDisplayRows(project){
    var tasksById = new Map(project.tasks.map(function(t){ return [t.id, t]; }));
    var childrenMap = buildChildrenMap(project.tasks);
    var rows = [];
    function pushSubtree(taskId, depth){
      var t = tasksById.get(taskId);
      if(!t) return;
      rows.push({ task:t, depth:depth });
      if(isGroupTask(taskId, childrenMap) && !t.collapsed){
        childrenMap.get(taskId).forEach(function(k){ pushSubtree(k.id, depth+1); });
      }
    }
    var topLevel = project.tasks.filter(function(t){ return !t.parentId || !tasksById.has(t.parentId); });
    topLevel.forEach(function(t){ pushSubtree(t.id, 0); });
    return rows;
  }
  function hasPrevSibling(rows, idx){
    var depth = rows[idx].depth;
    for(var i=idx-1;i>=0;i--){ if(rows[i].depth < depth) return false; if(rows[i].depth === depth) return true; }
    return false;
  }
  function hasNextSibling(rows, idx){
    var depth = rows[idx].depth;
    for(var i=idx+1;i<rows.length;i++){ if(rows[i].depth < depth) return false; if(rows[i].depth === depth) return true; }
    return false;
  }
  function prevSiblingId(rows, idx){
    var depth = rows[idx].depth;
    for(var i=idx-1;i>=0;i--){ if(rows[i].depth < depth) return null; if(rows[i].depth === depth) return rows[i].task.id; }
    return null;
  }
  function nextSiblingId(rows, idx){
    var depth = rows[idx].depth;
    for(var i=idx+1;i<rows.length;i++){ if(rows[i].depth < depth) return null; if(rows[i].depth === depth) return rows[i].task.id; }
    return null;
  }

  // relocate the block [id + its descendants] to just after the block [afterId + its (current) descendants]
  function relocateSubtreeAfter(tasksArr, id, afterId){
    var childrenMap = buildChildrenMap(tasksArr);
    var blockIds = new Set([id].concat(allDescendantIds(id, childrenMap)));
    var blockItems = tasksArr.filter(function(t){ return blockIds.has(t.id); });
    var rest = tasksArr.filter(function(t){ return !blockIds.has(t.id); });
    var restChildrenMap = buildChildrenMap(rest);
    var afterBlockIds = new Set([afterId].concat(allDescendantIds(afterId, restChildrenMap)));
    var insertPos = -1;
    rest.forEach(function(t,i){ if(afterBlockIds.has(t.id)) insertPos = i; });
    if(insertPos === -1) insertPos = rest.length - 1;
    var newArr = rest.slice(0, insertPos+1).concat(blockItems, rest.slice(insertPos+1));
    tasksArr.length = 0;
    newArr.forEach(function(t){ tasksArr.push(t); });
  }
  // relocate the block [id + its descendants] to just before the block [beforeId + its (current) descendants]
  function relocateSubtreeBefore(tasksArr, id, beforeId){
    var childrenMap = buildChildrenMap(tasksArr);
    var blockIds = new Set([id].concat(allDescendantIds(id, childrenMap)));
    var blockItems = tasksArr.filter(function(t){ return blockIds.has(t.id); });
    var rest = tasksArr.filter(function(t){ return !blockIds.has(t.id); });
    var restChildrenMap = buildChildrenMap(rest);
    var beforeBlockIds = new Set([beforeId].concat(allDescendantIds(beforeId, restChildrenMap)));
    var insertPos = rest.findIndex(function(t){ return beforeBlockIds.has(t.id); });
    if(insertPos === -1) insertPos = rest.length;
    var newArr = rest.slice(0, insertPos).concat(blockItems, rest.slice(insertPos));
    tasksArr.length = 0;
    newArr.forEach(function(t){ tasksArr.push(t); });
  }

  function indentTask(proj, taskId){
    var rows = buildDisplayRows(proj);
    var idx = rows.findIndex(function(r){ return r.task.id === taskId; });
    if(idx < 0) return false;
    var target = prevSiblingId(rows, idx);
    if(!target) return false;
    var task = proj.tasks.filter(function(t){ return t.id === taskId; })[0];
    task.parentId = target;
    relocateSubtreeAfter(proj.tasks, taskId, target);
    var parentTask = proj.tasks.filter(function(t){ return t.id === target; })[0];
    if(parentTask) parentTask.collapsed = false;
    return true;
  }
  function outdentTask(proj, taskId){
    var task = proj.tasks.filter(function(t){ return t.id === taskId; })[0];
    if(!task || !task.parentId) return false;
    var parentId = task.parentId;
    var parentTask = proj.tasks.filter(function(t){ return t.id === parentId; })[0];
    var grandParentId = parentTask ? (parentTask.parentId || null) : null;
    task.parentId = grandParentId;
    relocateSubtreeAfter(proj.tasks, taskId, parentId);
    return true;
  }
  function moveTask(proj, taskId, direction){
    var rows = buildDisplayRows(proj);
    var idx = rows.findIndex(function(r){ return r.task.id === taskId; });
    if(idx < 0) return false;
    if(direction < 0){
      var target = prevSiblingId(rows, idx);
      if(!target) return false;
      relocateSubtreeBefore(proj.tasks, taskId, target);
    } else {
      var target2 = nextSiblingId(rows, idx);
      if(!target2) return false;
      relocateSubtreeAfter(proj.tasks, taskId, target2);
    }
    return true;
  }

  // ---------------- CPM scheduling engine (operates on leaf tasks only) ----------------
  // anchorsByIso: optional Map(taskId -> ISO date string) — a manually-set start date that
  // acts as a floor on that task's earliest start (it can still be pushed later by
  // predecessors, but never earlier than the calendar allows).
  function computeSchedule(tasks, businessOnly, startDateISO, anchorsByIso){
    var startDate = parseISO(startDateISO);
    var seq = generateWorkingDates(startDate, 3000, businessOnly);
    if(!tasks.length){
      return { byId:new Map(), unscheduledIds:[], projectDuration:0, projectStartDate:startDate, projectEndDate:startDate, workingDates:seq };
    }
    var idSet = new Set(tasks.map(function(t){ return t.id; }));
    var deps = new Map();
    tasks.forEach(function(t){
      var clean = Array.from(new Set((t.deps||[]).filter(function(d){ return idSet.has(d) && d !== t.id; })));
      deps.set(t.id, clean);
    });
    var indegree = new Map(tasks.map(function(t){ return [t.id, deps.get(t.id).length]; }));
    var successors = new Map(tasks.map(function(t){ return [t.id, []]; }));
    tasks.forEach(function(t){ deps.get(t.id).forEach(function(d){ successors.get(d).push(t.id); }); });

    var anchorIdx = new Map();
    if(anchorsByIso){
      anchorsByIso.forEach(function(iso, taskId){
        if(idSet.has(taskId) && iso) anchorIdx.set(taskId, indexOfDateOrAfter(seq, parseISO(iso)));
      });
    }

    var durById = new Map(tasks.map(function(t){ return [t.id, Math.max(0, Math.round(Number(t.duration) || 0))]; }));
    var ES = new Map(tasks.map(function(t){ return [t.id, 0]; }));
    var EF = new Map();
    var queue = tasks.filter(function(t){ return indegree.get(t.id) === 0; }).map(function(t){ return t.id; });
    var order = [];
    while(queue.length){
      var u = queue.shift();
      order.push(u);
      if(anchorIdx.has(u)) ES.set(u, Math.max(ES.get(u), anchorIdx.get(u)));
      var esu = ES.get(u);
      var efu = esu + durById.get(u);
      EF.set(u, efu);
      successors.get(u).forEach(function(v){
        ES.set(v, Math.max(ES.get(v), efu));
        indegree.set(v, indegree.get(v) - 1);
        if(indegree.get(v) === 0) queue.push(v);
      });
    }
    var scheduledSet = new Set(order);
    var unscheduledIds = tasks.filter(function(t){ return !scheduledSet.has(t.id); }).map(function(t){ return t.id; });
    var projectDuration = order.length ? Math.max.apply(null, order.map(function(id){ return EF.get(id); })) : 0;

    var LF = new Map(), LS = new Map();
    for(var i = order.length - 1; i >= 0; i--){
      var uid = order[i];
      var succsScheduled = successors.get(uid).filter(function(v){ return scheduledSet.has(v); });
      var lf = succsScheduled.length ? Math.min.apply(null, succsScheduled.map(function(v){ return LS.get(v); })) : projectDuration;
      LF.set(uid, lf);
      LS.set(uid, lf - durById.get(uid));
    }

    var workingDates = seq;
    var byId = new Map();
    order.forEach(function(id){
      var es = ES.get(id), ef = EF.get(id), ls = LS.get(id), lf = LF.get(id), dur = durById.get(id);
      var startD = workingDates[es];
      var endD = dur > 0 ? workingDates[Math.max(ef - 1, es)] : workingDates[es];
      byId.set(id, { scheduled:true, es:es, ef:ef, ls:ls, lf:lf, slack: ls - es, critical:(ls - es) === 0, startDate:startD, endDate:endD, duration:dur, deps:deps.get(id) });
    });
    unscheduledIds.forEach(function(id){
      byId.set(id, { scheduled:false, duration: durById.get(id), deps: deps.get(id) });
    });
    var projectEndDate = order.length ? workingDates[Math.max(projectDuration - 1, 0)] : startDate;
    return { byId:byId, unscheduledIds:unscheduledIds, projectDuration:projectDuration, projectStartDate:startDate, projectEndDate:projectEndDate, workingDates:workingDates };
  }

  // ---------------- full schedule (leaves + group aggregation) ----------------
  function computeFullSchedule(project){
    var tasks = project.tasks;
    var tasksById = new Map(tasks.map(function(t){ return [t.id, t]; }));
    var childrenMap = buildChildrenMap(tasks);
    var leaves = tasks.filter(function(t){ return !isGroupTask(t.id, childrenMap); });
    var leafInputs = leaves.map(function(t){ return { id:t.id, duration:t.duration, deps: expandDepsForLeaf(t, tasksById, childrenMap) }; });
    var anchorsByIso = new Map();
    leaves.forEach(function(t){ if(t.startOverride) anchorsByIso.set(t.id, t.startOverride); });
    var core = computeSchedule(leafInputs, project.businessDaysOnly, project.startDate, anchorsByIso);

    var groupCache = new Map();
    function aggFor(id){
      if(groupCache.has(id)) return groupCache.get(id);
      var result;
      if(!isGroupTask(id, childrenMap)){
        result = core.byId.get(id) || { scheduled:false };
      } else {
        var kids = childrenMap.get(id);
        var starts = [], ends = [], anyCritical = false, wsum = 0, dsum = 0, allSched = true;
        kids.forEach(function(k){
          var a = aggFor(k.id);
          if(!a || !a.scheduled){ allSched = false; return; }
          starts.push(a.startDate); ends.push(a.endDate);
          if(a.critical) anyCritical = true;
          var kTask = tasksById.get(k.id);
          var kProgress = isGroupTask(k.id, childrenMap) ? a.progress : (kTask.progress || 0);
          var w = Math.max(a.duration || 0, 1);
          wsum += kProgress * w; dsum += w;
        });
        if(!starts.length || !allSched){
          result = { scheduled:false };
        } else {
          var minS = starts.reduce(function(x,y){ return x < y ? x : y; });
          var maxE = ends.reduce(function(x,y){ return x > y ? x : y; });
          result = { scheduled:true, startDate:minS, endDate:maxE, critical:anyCritical, duration: daysBetween(minS,maxE)+1, progress: dsum ? Math.round(wsum/dsum) : 0, slack:null };
        }
      }
      groupCache.set(id, result);
      return result;
    }
    tasks.forEach(function(t){ aggFor(t.id); });

    return {
      core: core,
      childrenMap: childrenMap,
      tasksById: tasksById,
      isGroup: function(id){ return isGroupTask(id, childrenMap); },
      infoFor: function(id){
        var base = groupCache.get(id);
        if(!base) return { scheduled:false, isGroup:false };
        if(isGroupTask(id, childrenMap)) return Object.assign({ isGroup:true }, base);
        var t = tasksById.get(id);
        return Object.assign({ isGroup:false, progress: t ? (t.progress||0) : 0 }, base);
      }
    };
  }

  // Whether a project has at least one activity (leaf or group) whose computed end date has
  // already passed while it's still not 100% complete. Unlike the per-row "Sinalizar prazos"
  // highlighting, this check is independent of that display toggle — it's meant to surface a
  // persistent "something here is late" warning in the sidebar project list regardless of how
  // that individual project's own display options are configured.
  function projectHasOverdueTask(project, full){
    var today = todayDate();
    return project.tasks.some(function(t){
      var info = full.infoFor(t.id);
      if(!info.scheduled || (info.progress||0) >= 100) return false;
      var endD = new Date(info.endDate); endD.setHours(0,0,0,0);
      return endD < today;
    });
  }

  function taskLabel(idx){ return "T"+(idx+1); }

  // ---------------- replanning tracking ----------------
  // When enabled, the first time a task's computed dates are observed they become its
  // "baseline" (the reference plan). From then on, every time the computed start/end
  // actually shifts from what was last observed (a duration edit, a predecessor slipping,
  // a manual date override...) the task's replanCount goes up by one — regardless of what
  // caused the shift. "Aceitar novo baseline" (accept-baseline action) resets the baseline
  // to the current dates and zeroes the counter once the new plan is validated.
  function reconcileReplan(p, full){
    if(!p.replanEnabled) return false;
    var changed = false;
    p.tasks.forEach(function(t){
      var info = full.infoFor(t.id);
      if(!info.scheduled) return;
      var curStart = toISO(info.startDate), curEnd = toISO(info.endDate);
      if(!t.baselineStart || !t.baselineEnd){
        t.baselineStart = curStart;
        t.baselineEnd = curEnd;
        t.lastSeenStart = curStart;
        t.lastSeenEnd = curEnd;
        t.replanCount = t.replanCount || 0;
        changed = true;
        return;
      }
      if(t.lastSeenStart !== curStart || t.lastSeenEnd !== curEnd){
        t.replanCount = (t.replanCount || 0) + 1;
        t.lastSeenStart = curStart;
        t.lastSeenEnd = curEnd;
        changed = true;
      }
    });
    return changed;
  }

  // ---------------- storage ----------------
  function defaultTask(over){
    return Object.assign({ id:genId(), name:"Nova atividade", duration:1, deps:[], parentId:null, collapsed:false, color:null, responsible:"", notes:"", progress:0, milestoneIcon:null, startOverride:null, atRisk:false, baselineStart:null, baselineEnd:null, lastSeenStart:null, lastSeenEnd:null, replanCount:0 }, over||{});
  }

  function seedState(){
    var start = todayDate();
    var g1="g1", g2="g2", g3="g3";
    var t1="t1",t2="t2",t3="t3",t4="t4",t5="t5",t6="t6",t7="t7",t8="t8",t9="t9";
    function t(over){ return defaultTask(over); }
    var tasks = [
      t({id:g1, name:"Fase 1 — Descoberta e design", duration:0, deps:[]}),
      t({id:t1, name:"Levantamento de requisitos", duration:3, deps:[], parentId:g1, responsible:"Marina", progress:100}),
      t({id:t2, name:"Wireframes", duration:2, deps:[t1], parentId:g1, responsible:"Marina", progress:100}),
      t({id:g2, name:"Fase 2 — Produção", duration:0, deps:[]}),
      t({id:t3, name:"Design visual", duration:4, deps:[t2], parentId:g2, responsible:"Diego", progress:55, color:"plum", notes:"Aguardando aprovação da identidade visual com o cliente."}),
      t({id:t4, name:"Conteúdo e redação", duration:3, deps:[t1], parentId:g2, responsible:"Renata", progress:80}),
      t({id:t5, name:"Desenvolvimento front-end", duration:6, deps:[t3], parentId:g2, responsible:"Diego", progress:15}),
      t({id:t6, name:"Integração com back-end", duration:4, deps:[t5], parentId:g2, responsible:"Diego", progress:0, notes:"Depende da API do time de infraestrutura ficar pronta."}),
      t({id:g3, name:"Fase 3 — Lançamento", duration:0, deps:[]}),
      t({id:t7, name:"Testes de QA", duration:3, deps:[t6,t4], parentId:g3, responsible:"Renata", progress:0}),
      t({id:t8, name:"Ajustes finais", duration:2, deps:[t7], parentId:g3, responsible:"Marina", progress:0}),
      t({id:t9, name:"Publicação", duration:0, deps:[t8], parentId:g3, responsible:"Marina", progress:0, milestoneIcon:"flag"})
    ];
    var project = { id:genId(), name:"Exemplo — Lançamento do site institucional", startDate: toISO(start), businessDaysOnly:true, showResponsible:true, showPredecessors:true, showNotes:true, pinned:false, dueSoonEnabled:false, dueSoonDays:3, replanEnabled:false, barLabelMode:"percent", ganttScale:"weeks", ganttZoom:1, ganttLabelWidth:220, isExample:true, tasks:tasks };
    return { projects:[project], activeId: project.id, sidebarCollapsed:false };
  }

  function normalizeProject(p){
    p.name = p.name || "Projeto sem nome";
    p.startDate = p.startDate || toISO(todayDate());
    p.businessDaysOnly = p.businessDaysOnly !== false;
    p.showResponsible = !!p.showResponsible;
    p.showPredecessors = p.showPredecessors !== false;
    p.showNotes = !!p.showNotes;
    p.pinned = !!p.pinned;
    p.dueSoonEnabled = !!p.dueSoonEnabled;
    var dsd = Math.round(Number(p.dueSoonDays));
    p.dueSoonDays = (!isNaN(dsd) && dsd >= 0) ? dsd : 3;
    p.replanEnabled = !!p.replanEnabled;
    p.isExample = !!p.isExample;
    p.barLabelMode = (p.barLabelMode === "duration") ? "duration" : "percent";
    p.ganttScale = ["days","weeks","months","both"].indexOf(p.ganttScale) !== -1 ? p.ganttScale : "weeks";
    var gz = Number(p.ganttZoom);
    p.ganttZoom = (!isNaN(gz) && gz >= 0.3 && gz <= 3) ? gz : 1;
    var glw = Math.round(Number(p.ganttLabelWidth));
    p.ganttLabelWidth = (!isNaN(glw) && glw >= 100 && glw <= 560) ? glw : 220;
    p.tasks = (Array.isArray(p.tasks) ? p.tasks : []).map(function(t){
      return {
        id: t.id || genId(),
        name: typeof t.name === "string" ? t.name : "",
        duration: (typeof t.duration === "number" && !isNaN(t.duration)) ? Math.max(0, Math.round(t.duration)) : 0,
        deps: Array.isArray(t.deps) ? t.deps.slice() : [],
        parentId: t.parentId || null,
        collapsed: !!t.collapsed,
        color: t.color || null,
        responsible: typeof t.responsible === "string" ? t.responsible : "",
        notes: typeof t.notes === "string" ? t.notes : "",
        progress: (typeof t.progress === "number" && !isNaN(t.progress)) ? Math.min(100, Math.max(0, Math.round(t.progress))) : 0,
        milestoneIcon: (typeof t.milestoneIcon === "string") ? t.milestoneIcon : null,
        startOverride: (typeof t.startOverride === "string" && t.startOverride) ? t.startOverride : null,
        atRisk: !!t.atRisk,
        baselineStart: (typeof t.baselineStart === "string" && t.baselineStart) ? t.baselineStart : null,
        baselineEnd: (typeof t.baselineEnd === "string" && t.baselineEnd) ? t.baselineEnd : null,
        lastSeenStart: (typeof t.lastSeenStart === "string" && t.lastSeenStart) ? t.lastSeenStart : null,
        lastSeenEnd: (typeof t.lastSeenEnd === "string" && t.lastSeenEnd) ? t.lastSeenEnd : null,
        replanCount: (typeof t.replanCount === "number" && !isNaN(t.replanCount) && t.replanCount >= 0) ? Math.round(t.replanCount) : 0
      };
    });
    return p;
  }
  function normalizeState(s){
    if(!s || !Array.isArray(s.projects)) return seedState();
    s.projects = s.projects.map(normalizeProject);
    if(!s.activeId || !s.projects.some(function(p){ return p.id === s.activeId; })){
      s.activeId = s.projects.length ? s.projects[0].id : null;
    }
    s.sidebarCollapsed = !!s.sidebarCollapsed;
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedState();
      var parsed = JSON.parse(raw);
      return normalizeState(parsed);
    }catch(e){
      console.warn("Easy Timeline: não foi possível ler o armazenamento local, iniciando com o exemplo.", e);
      return seedState();
    }
  }

  var state = loadState();
  var saveOk = true;
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); saveOk = true; }
    catch(e){ saveOk = false; console.warn("Easy Timeline: falha ao salvar no armazenamento local.", e); }
  }

  function activeProject(){
    return state.projects.filter(function(p){ return p.id === state.activeId; })[0] || null;
  }

  function saveAndRender(){ persist(); render(); }

  function showToast(msg){
    ui.toast = msg;
    if(toastTimer) clearTimeout(toastTimer);
    render();
    toastTimer = setTimeout(function(){ ui.toast = null; render(); }, 2600);
  }

  // ---------------- downloads (Excel / PNG) ----------------
  function doDownload(filename, blob){
    if(!window.claude || !window.claude.use){
      showToast("Exportação de arquivos não é suportada neste ambiente.");
      return;
    }
    window.claude.use("downloads").then(function(downloads){
      if(!downloads){ showToast("Exportação de arquivos não está disponível aqui."); return; }
      return downloads.save({ filename:filename, data:blob }).then(function(res){
        showToast(res.status === "saved" ? "Arquivo salvo." : "Arquivo enviado.");
      });
    }).catch(function(err){
      var code = err && err.code;
      var msg = "Não foi possível exportar o arquivo.";
      if(code === "declined") msg = "Exportação cancelada.";
      else if(code === "rejected_extension" || code === "extension_not_enabled") msg = "Esse formato não está disponível aqui.";
      else if(code === "rate_limited") msg = "Aguarde um instante e tente exportar de novo.";
      else if(code === "too_large") msg = "O arquivo ficou grande demais para exportar aqui.";
      showToast(msg);
    });
  }

  function exportExcel(){
    var proj = activeProject();
    if(!proj || !proj.tasks.length){ showToast("Adicione atividades antes de exportar."); return; }
    if(typeof XLSX === "undefined"){ showToast("Biblioteca de exportação ainda carregando — tente novamente em instantes."); return; }
    var full = computeFullSchedule(proj);
    var rows = buildDisplayRows(proj);
    var header = ["Código","Nível","Atividade"];
    if(proj.showResponsible) header.push("Responsável");
    header = header.concat(["Duração (dias)","Predecessoras","Início","Término","% Concluído","Em risco"]);
    if(proj.showNotes) header.push("Observações");
    var data = [header];
    rows.forEach(function(r){
      var idx = proj.tasks.findIndex(function(x){ return x.id === r.task.id; });
      var code = taskLabel(idx);
      var info = full.infoFor(r.task.id);
      var indent = Array(r.depth+1).join("    ");
      var depsTxt = (r.task.deps||[]).map(function(d){
        var di = proj.tasks.findIndex(function(x){ return x.id === d; });
        return di > -1 ? taskLabel(di) : null;
      }).filter(Boolean).join(", ");
      var row = [code, r.depth+1, indent + (r.task.name || "(sem nome)")];
      if(proj.showResponsible) row.push(r.task.responsible || "");
      row.push(info.isGroup ? "" : (r.task.duration || 0));
      row.push(info.isGroup ? "" : depsTxt);
      row.push(info.scheduled ? fmtFull(info.startDate) : "");
      row.push(info.scheduled ? fmtFull(info.endDate) : "");
      row.push(info.progress || 0);
      row.push(r.task.atRisk ? "Sim" : "Não");
      if(proj.showNotes) row.push(r.task.notes || "");
      data.push(row);
    });
    var ws = XLSX.utils.aoa_to_sheet(data);
    var widths = [{wch:7},{wch:6},{wch:38}];
    if(proj.showResponsible) widths.push({wch:18});
    widths = widths.concat([{wch:13},{wch:16},{wch:12},{wch:12},{wch:11},{wch:8}]);
    if(proj.showNotes) widths.push({wch:40});
    ws["!cols"] = widths;
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cronograma");
    var out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    var blob = new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    doDownload(slugify(proj.name)+".xlsx", blob);
  }

  function exportPng(){
    var proj = activeProject();
    if(!proj || !proj.tasks.length){ showToast("Adicione atividades antes de exportar."); return; }
    var panel = root.querySelector(".gantt-panel");
    if(!panel){ showToast("Nada para exportar ainda."); return; }
    if(typeof html2canvas === "undefined"){ showToast("Biblioteca de exportação ainda carregando — tente novamente em instantes."); return; }
    var bg = getComputedStyle(document.documentElement).getPropertyValue("--paper-raised").trim() || "#ffffff";
    html2canvas(panel, {
      backgroundColor: bg,
      scale: 2,
      onclone: function(clonedDoc){
        var gs = clonedDoc.querySelector(".gantt-scroll");
        if(gs){ gs.style.overflow = "visible"; gs.style.width = gs.scrollWidth + "px"; gs.style.maxHeight = "none"; }
        var labels = clonedDoc.querySelector(".gantt-labels");
        if(labels){ labels.style.position = "static"; }
      }
    }).then(function(canvas){
      canvas.toBlob(function(blob){
        if(!blob){ showToast("Não foi possível gerar a imagem."); return; }
        doDownload(slugify(proj.name)+"-gantt.png", blob);
      }, "image/png");
    }).catch(function(err){
      console.warn(err);
      showToast("Não foi possível gerar a imagem.");
    });
  }

  // ---------------- rendering ----------------
  function render(){
    var proj = activeProject();
    root.classList.toggle("is-sidebar-collapsed", !!state.sidebarCollapsed);
    root.innerHTML =
      renderSidebar(proj) +
      '<main class="main">' + (proj ? renderProject(proj) : renderEmpty()) + '</main>' +
      (state.sidebarCollapsed ? '<button class="sidebar-expand-btn" type="button" data-action="toggle-sidebar" title="Mostrar barra lateral">☰</button>' : '') +
      renderPopover(proj) +
      renderRestoreModal() +
      renderQuickAddModal() +
      (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '');
    if(ui.focusNextId){
      var elF = root.querySelector('.name-input[data-task-id="'+ui.focusNextId+'"]');
      if(elF){ elF.focus(); var len = elF.value.length; try{ elF.setSelectionRange(len,len); }catch(e){} }
      ui.focusNextId = null;
    }
    if(ui.focusQuickAdd){
      var elQ = document.getElementById("quickAddTextarea");
      if(elQ){ elQ.focus(); }
      ui.focusQuickAdd = false;
    }
    var selAllEl = document.getElementById("selectAllTasksCheckbox");
    if(selAllEl && proj){
      var rowsSA = buildDisplayRows(proj);
      var fullSA = computeFullSchedule(proj);
      var selectableSA = rowsSA.filter(function(r){ return !fullSA.isGroup(r.task.id); }).map(function(r){ return r.task.id; });
      var selectedSA = selectableSA.filter(function(id){ return ui.bulkSelectedIds.has(id); }).length;
      selAllEl.indeterminate = selectedSA > 0 && selectedSA < selectableSA.length;
    }
    // Group-row bulk-select checkboxes have no HTML attribute for the mixed/indeterminate
    // state, so it must be computed and set imperatively after each render, per group.
    var groupSelectEls = root.querySelectorAll('[data-action="toggle-select-group"]');
    if(groupSelectEls.length && proj){
      var childrenMapGS = buildChildrenMap(proj.tasks);
      groupSelectEls.forEach(function(elGS){
        var leafIdsGS = leafDescendants(elGS.getAttribute("data-id"), childrenMapGS);
        var selectedGS = leafIdsGS.filter(function(id){ return ui.bulkSelectedIds.has(id); }).length;
        elGS.checked = leafIdsGS.length > 0 && selectedGS === leafIdsGS.length;
        elGS.indeterminate = selectedGS > 0 && selectedGS < leafIdsGS.length;
      });
    }
    applyProjectFilter();
  }

  function applyProjectFilter(){
    var q = (ui.projectSearch || "").trim().toLowerCase();
    var items = root.querySelectorAll(".project-item");
    var any = false;
    items.forEach(function(el){
      var name = el.getAttribute("data-name") || "";
      var match = !q || name.indexOf(q) !== -1;
      el.hidden = !match;
      if(match) any = true;
    });
    var empty = root.querySelector(".project-search-empty");
    if(empty) empty.hidden = !(q && !any);
    root.querySelectorAll(".project-list-divider").forEach(function(d){ d.hidden = !!q; });
  }

  function renderEmpty(){
    return '<div class="empty-state">Nenhum projeto selecionado.<br>Crie um projeto na barra lateral para começar.</div>';
  }

  function renderSidebar(proj){
    var sorted = state.projects.slice().sort(function(a, b){
      var ap = a.pinned ? 1 : 0, bp = b.pinned ? 1 : 0;
      return bp - ap;
    });
    var firstUnpinnedIdx = -1;
    for(var i = 0; i < sorted.length; i++){ if(!sorted[i].pinned){ firstUnpinnedIdx = i; break; } }

    var items = sorted.map(function(p, idx){
      var full = computeFullSchedule(p);
      var active = p.id === state.activeId;
      var pendingThis = ui.pendingDelete && ui.pendingDelete.kind === "project" && ui.pendingDelete.id === p.id;
      var durTxt = p.tasks.length ? (full.core.projectDuration + (p.businessDaysOnly ? " dias úteis" : " dias")) : "vazio";
      var overdue = p.tasks.length ? projectHasOverdueTask(p, full) : false;
      var overdueFlag = overdue ? '<span class="project-overdue-flag" title="Este cronograma tem atividade(s) em atraso">!</span>' : '';
      var divider = (idx === firstUnpinnedIdx && idx > 0) ? '<div class="project-list-divider"></div>' : '';
      return divider + '' +
        '<div class="project-item'+(active?' active':'')+'" data-action="select-project" data-id="'+p.id+'" data-name="'+esc(p.name.toLowerCase())+'">' +
          '<div class="project-item-top">' +
            '<span class="project-name-wrap"><span class="project-name">'+esc(p.name)+'</span>'+overdueFlag+'</span>' +
            '<span class="project-item-actions">' +
              '<button class="icon-btn pin-btn'+(p.pinned?' is-pinned':'')+'" type="button" data-action="toggle-pin-project" data-id="'+p.id+'" title="'+(p.pinned?'Desafixar dos favoritos':'Fixar no topo')+'">'+(p.pinned?'★':'☆')+'</button>' +
              '<button class="icon-btn" type="button" data-action="delete-project" data-id="'+p.id+'" title="Excluir projeto">'+(pendingThis ? '<span class="mono" style="color:var(--rust); font-size:.65rem;">confirmar</span>' : '✕')+'</button>' +
            '</span>' +
          '</div>' +
          '<span class="project-meta">'+p.tasks.length+' atividade'+(p.tasks.length===1?'':'s')+' · '+durTxt+'</span>' +
          (p.isExample ? '<span class="example-tag">exemplo</span>' : '') +
        '</div>';
    }).join("");

    return '' +
      '<aside class="sidebar">' +
        '<div>' +
          '<div class="sidebar-top-row">' +
            '<div class="brand"><span class="display brand-mark">Easy Timeline</span><span class="brand-sub mono">cronogramas</span></div>' +
            '<button class="sidebar-collapse-btn" type="button" data-action="toggle-sidebar" title="Ocultar barra lateral">‹</button>' +
          '</div>' +
          '<div class="ruler"></div>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" type="button" data-action="new-project">+ Novo projeto</button>' +
        (state.projects.length > 1 ? '<input type="text" id="projectSearchInput" class="sidebar-search" placeholder="Buscar projeto..." value="'+esc(ui.projectSearch)+'">' : '') +
        '<div class="project-list">'+(items || '<div class="storage-note">Nenhum projeto ainda.</div>')+'</div>' +
        '<p class="storage-note project-search-empty" hidden>Nenhum projeto encontrado.</p>' +
        '<div class="sidebar-foot">' +
          '<button class="btn btn-sm" type="button" data-action="copy-backup">⧉ Copiar backup</button>' +
          '<button class="btn btn-sm" type="button" data-action="open-restore">↺ Restaurar backup</button>' +
          '<p class="storage-note">Os dados ficam salvos apenas neste navegador' + (saveOk ? '' : ' — <span style="color:var(--rust)">o salvamento automático falhou</span>') + '. Use o backup para levar seus cronogramas a outro navegador ou dispositivo.</p>' +
        '</div>' +
      '</aside>';
  }

  function renderProject(p){
    var full = computeFullSchedule(p);
    if(reconcileReplan(p, full)) persist();
    var rows = buildDisplayRows(p);
    var existingTaskIds = new Set(p.tasks.map(function(t){ return t.id; }));
    Array.from(ui.bulkSelectedIds).forEach(function(id){ if(!existingTaskIds.has(id)) ui.bulkSelectedIds.delete(id); });
    var bulkSelectableIds = rows.filter(function(r){ return !full.isGroup(r.task.id); }).map(function(r){ return r.task.id; });
    var bulkSelectedCount = bulkSelectableIds.filter(function(id){ return ui.bulkSelectedIds.has(id); }).length;
    var html = '';
    html += '<div class="project-header">';
    html += '  <input class="title-input display" type="text" value="'+esc(p.name)+'" data-field="name" data-scope="project" placeholder="Nome do projeto">';
    html += '  <div class="meta-row">';
    html += '    <div class="field"><label for="startDateText">Início</label>' +
      '<div class="date-field">' +
        '<input id="startDateText" type="text" class="date-input date-text-input" inputmode="numeric" placeholder="dd/mm/aaaa" value="'+esc(fmtDateBR(p.startDate))+'" data-date-text="1" data-scope="project" title="Digite ou cole a data (dd/mm/aaaa)">' +
        '<input id="startDate" type="date" class="date-input date-native-input" value="'+esc(p.startDate)+'" data-field="startDate" data-scope="project" title="Escolher no calendário">' +
      '</div>' +
    '</div>';
    html += '    <label class="toggle" title="Ao calcular datas de início e término, pula sábados e domingos."><input type="checkbox" '+(p.businessDaysOnly?'checked':'')+' data-field="businessDaysOnly" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Somente dias úteis</span></label>';
    html += '    <label class="toggle" title="Exibe ou oculta a coluna de responsável na tabela de atividades."><input type="checkbox" '+(p.showResponsible?'checked':'')+' data-field="showResponsible" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Mostrar responsável</span></label>';
    html += '    <label class="toggle" title="Exibe ou oculta a coluna de predecessoras (dependências entre atividades) na tabela."><input type="checkbox" '+(p.showPredecessors?'checked':'')+' data-field="showPredecessors" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Mostrar predecessoras</span></label>';
    html += '    <label class="toggle" title="Exibe ou oculta a coluna de observações na tabela de atividades."><input type="checkbox" '+(p.showNotes?'checked':'')+' data-field="showNotes" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Mostrar observações</span></label>';
    html += '    <label class="toggle" title="Destaca em vermelho as atividades já vencidas e em amarelo as que estão perto do prazo (defina a antecedência ao lado)."><input type="checkbox" '+(p.dueSoonEnabled?'checked':'')+' data-field="dueSoonEnabled" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Sinalizar prazos</span></label>';
    if(p.dueSoonEnabled){
      html += '    <div class="field" title="Quantos dias antes do término uma atividade passa a ser sinalizada como \'prazo próximo\'."><label for="dueSoonDays">Avisar com</label><input id="dueSoonDays" type="number" min="0" max="90" step="1" value="'+p.dueSoonDays+'" data-field="dueSoonDays" data-scope="project" style="width:48px;"><label for="dueSoonDays">dia(s) de antecedência</label></div>';
    }
    html += '    <label class="toggle" title="Guarda a data original de cada atividade como referência. Se a data calculada mudar depois (por exemplo, por atraso de uma predecessora), a atividade recebe um selo ↻ indicando quantas vezes já foi replanejada."><input type="checkbox" '+(p.replanEnabled?'checked':'')+' data-field="replanEnabled" data-scope="project"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-label">Sinalizar replanejamento</span></label>';
    if(p.tasks.length){
      html += '    <span class="summary-pill">Duração: <b>'+full.core.projectDuration+(p.businessDaysOnly?' dias úteis':' dias')+'</b> · Término: <b>'+fmtFull(full.core.projectEndDate)+'</b></span>';
    }
    html += '  </div>';
    html += '</div>';

    if(full.core.unscheduledIds.length){
      var names = full.core.unscheduledIds.map(function(id){
        var idx = p.tasks.findIndex(function(t){ return t.id === id; });
        return taskLabel(idx) + ' "' + (p.tasks[idx] ? (p.tasks[idx].name || "(sem nome)") : "") + '"';
      }).join(", ");
      html += '<div class="banner">⚠<div><strong>Dependência circular detectada</strong>As atividades a seguir não puderam ser agendadas porque suas predecessoras formam um ciclo: '+esc(names)+'. Ajuste as predecessoras para corrigir.</div></div>';
    }

    html += '<div class="toolbar">' +
      '<div class="toolbar-left">' +
        '<button class="btn btn-primary" type="button" data-action="add-task" title="Adiciona logo abaixo da linha selecionada, no mesmo nível">+ Adicionar atividade</button>' +
        '<button class="btn btn-sm" type="button" data-action="open-quickadd" title="Cole ou digite vários nomes de atividade de uma vez, uma por linha">☰ Adicionar em lista</button>' +
        (bulkSelectedCount > 0 ? (
          '<span class="bulk-bar">' +
            '<span class="bulk-count">'+bulkSelectedCount+' selecionada'+(bulkSelectedCount===1?'':'s')+'</span>' +
            '<button class="btn btn-sm btn-primary" type="button" data-action="bulk-complete" title="Marcar as atividades selecionadas como 100% concluídas">✓ Concluir (100%)</button>' +
            '<button class="btn btn-sm btn-ghost" type="button" data-action="clear-selection" title="Limpar seleção">Limpar</button>' +
          '</span>'
        ) : '') +
      '</div>' +
      '<div class="toolbar-right">' +
        '<button class="btn btn-sm" type="button" data-action="export-excel" title="Exportar tabela para Excel">⇩ Excel</button>' +
        '<button class="btn btn-sm" type="button" data-action="export-png" title="Exportar gráfico de Gantt como imagem">⇩ PNG</button>' +
      '</div>' +
    '</div>';

    html += renderTable(p, full, rows);
    html += renderGantt(p, full, rows);

    return html;
  }

  function renderTable(p, full, rows){
    if(!p.tasks.length){
      return '<div class="table-wrap"><div class="empty-state">Nenhuma atividade ainda. Clique em "Adicionar atividade" para começar.</div></div>';
    }
    var trs = rows.map(function(row, rowIdx){
      var t = row.task, depth = row.depth;
      var idx = p.tasks.findIndex(function(x){ return x.id === t.id; });
      var info = full.infoFor(t.id);
      var isGroup = info.isGroup;
      var rowClass = !info.scheduled ? 'is-unscheduled' : (t.atRisk ? 'is-at-risk' : '');
      if(isGroup) rowClass += ' is-group-row';
      if(t.id === ui.selectedTaskId) rowClass += ' is-selected';

      var bulkCheckbox = !isGroup
        ? '<input type="checkbox" class="row-select-checkbox" data-action="toggle-select-task" data-id="'+t.id+'" '+(ui.bulkSelectedIds.has(t.id)?'checked':'')+' title="Selecionar para concluir em lote">'
        : '<input type="checkbox" class="row-select-checkbox" data-action="toggle-select-group" data-id="'+t.id+'" title="Selecionar todas as subatividades para concluir em lote">';

      var chevron = isGroup
        ? '<button class="tree-toggle" type="button" data-action="toggle-collapse" data-id="'+t.id+'" title="'+(t.collapsed?'Expandir':'Recolher')+'">'+(t.collapsed?'▸':'▾')+'</button>'
        : '<span class="tree-spacer"></span>';
      var colorHex = effectiveColorHex(t, full.tasksById);
      var colorDot = '<button class="color-dot'+(colorHex?' has-color':'')+(t.color?' is-own':'')+'" type="button" data-action="open-color-menu" data-task-id="'+t.id+'" title="Definir cor" style="'+(colorHex?('background:'+colorHex+';border-color:'+colorHex+';'):'')+'"></button>';

      var chips = (t.deps||[]).map(function(depId){
        var depIdx = p.tasks.findIndex(function(x){ return x.id === depId; });
        if(depIdx === -1) return '';
        return '<span class="chip">'+taskLabel(depIdx)+'<button type="button" data-action="remove-dep" data-task-id="'+t.id+'" data-dep-id="'+depId+'" title="Remover dependência">×</button></span>';
      }).join("");

      var canEditDates = !isGroup;
      var progress = info.progress || 0;

      var dueDotCls = null, dueDotTitle = "";
      if(p.dueSoonEnabled && info.scheduled && progress < 100){
        var todayD = todayDate();
        var endD = new Date(info.endDate); endD.setHours(0,0,0,0);
        var diffDays = Math.round((endD - todayD) / 86400000);
        if(diffDays < 0){
          dueDotCls = "overdue";
          dueDotTitle = "Atrasada — venceu há " + Math.abs(diffDays) + " dia(s)";
        } else if(diffDays <= (p.dueSoonDays||0)){
          dueDotCls = "soon";
          dueDotTitle = diffDays === 0 ? "Vence hoje" : ("Vence em " + diffDays + " dia(s)");
        }
      }
      var dueFlag = dueDotCls
        ? ('<span class="due-flag due-flag-'+dueDotCls+'" title="'+esc(dueDotTitle)+'">'+(dueDotCls==='overdue'?'!':'')+'</span>')
        : '';
      var endDateCls = dueDotCls === 'overdue' ? ' is-overdue' : '';

      var replanBadge = "";
      if(p.replanEnabled && t.replanCount > 0){
        var replanTitle = "Replanejada "+t.replanCount+"x — original: "+
          (t.baselineStart ? fmtFull(parseISO(t.baselineStart)) : "?")+" a "+(t.baselineEnd ? fmtFull(parseISO(t.baselineEnd)) : "?")+
          ", atual: "+(info.scheduled ? fmtFull(info.startDate) : "?")+" a "+(info.scheduled ? fmtFull(info.endDate) : "?");
        replanBadge = '<span class="replan-badge" title="'+esc(replanTitle)+'">↻'+t.replanCount+'</span>';
      }

      var startCell, endCell;
      if(canEditDates){
        var startVal = info.scheduled ? toISO(info.startDate) : (t.startOverride || "");
        startCell = '<div class="date-edit">' +
            '<div class="date-field">' +
              '<input type="text" class="date-input date-text-input" inputmode="numeric" placeholder="dd/mm/aaaa" value="'+esc(fmtDateBR(startVal))+'" data-date-text="1" data-task-id="'+t.id+'" data-for-field="startOverride" title="Digite ou cole a data (dd/mm/aaaa)">' +
              '<input type="date" class="date-input date-native-input" value="'+esc(startVal)+'" data-field="startOverride" data-task-id="'+t.id+'" title="Escolher no calendário">' +
            '</div>' +
            (t.startOverride ? '<button class="date-clear-btn" type="button" data-action="clear-start-override" data-id="'+t.id+'" title="Voltar a calcular automaticamente">↺</button>' : '') +
          '</div>';
        if(t.duration === 0){
          endCell = info.scheduled
            ? ('<div class="date-flag-wrap"><span class="date-text'+endDateCls+'">'+fmtShort(info.endDate)+'</span>'+dueFlag+'</div>')
            : '<span class="dash">—</span>';
        } else {
          var endVal = info.scheduled ? toISO(info.endDate) : "";
          endCell = '<div class="date-flag-wrap">' +
              '<div class="date-field">' +
                '<input type="text" class="date-input date-text-input'+endDateCls+'" inputmode="numeric" placeholder="dd/mm/aaaa" value="'+esc(fmtDateBR(endVal))+'" data-date-text="1" data-task-id="'+t.id+'" data-for-field="endDateManual" title="Digite ou cole a data (dd/mm/aaaa) — ajusta a duração">' +
                '<input type="date" class="date-input date-native-input'+endDateCls+'" value="'+esc(endVal)+'" data-field="endDateManual" data-task-id="'+t.id+'" title="Escolher no calendário">' +
              '</div>' +
              dueFlag +
            '</div>';
        }
      } else {
        startCell = info.scheduled ? fmtShort(info.startDate) : '<span class="dash">—</span>';
        endCell = info.scheduled
          ? ('<div class="date-flag-wrap"><span class="date-text'+endDateCls+'">'+fmtShort(info.endDate)+'</span>'+dueFlag+'</div>')
          : '<span class="dash">—</span>';
      }

      var durCell;
      if(isGroup){
        durCell = '<span class="dur-readout mono">'+(info.scheduled ? (info.duration+' d') : '—')+'</span>';
      } else if(t.duration === 0){
        var mIcon = t.milestoneIcon || "diamond";
        var mPaint = resolveMilestonePaint(colorHex, true);
        durCell = '<div class="milestone-cell">' +
          '<button class="milestone-icon-btn" type="button" data-action="open-milestone-menu" data-task-id="'+t.id+'" title="Ícone do marco"><svg width="18" height="18" viewBox="0 0 18 18">'+milestoneShapeSvg(mIcon,9,9,6,mPaint)+'</svg></button>' +
          '<button class="row-icon-btn" type="button" data-action="unset-milestone" data-id="'+t.id+'" title="Transformar em atividade normal">↩</button>' +
        '</div>';
      } else {
        durCell = '<div class="dur-cell"><input class="dur-input" type="number" min="0" step="1" value="'+t.duration+'" data-field="duration" data-task-id="'+t.id+'"><span class="dur-unit">d</span>' +
          '<span class="stepper">' +
            '<button class="stepper-btn" type="button" data-action="dur-step" data-dir="up" data-id="'+t.id+'" title="Aumentar 1 dia">▲</button>' +
            '<button class="stepper-btn" type="button" data-action="dur-step" data-dir="down" data-id="'+t.id+'" title="Diminuir 1 dia">▼</button>' +
          '</span>' +
          '<button class="milestone-toggle-btn" type="button" data-action="set-milestone" data-id="'+t.id+'" title="Marcar como marco">◆</button></div>';
      }

      var depsCell = isGroup
        ? '<span class="dash-muted" title="Atividade agrupadora — segue a sequência das subatividades">—</span>'
        : ('<div class="deps-cell">'+chips+'<button class="add-dep-btn" type="button" data-action="add-dep" data-task-id="'+t.id+'" title="Adicionar predecessora">+</button></div>');

      var isDone = progress >= 100;
      var pctColor = isDone ? "var(--sage)" : (colorHex || "var(--blue)");
      var progressBar = '<span class="progress-track"><span class="progress-fill-el" style="width:'+progress+'%; background:'+pctColor+';"></span></span>';
      var progressCell;
      if(isGroup){
        progressCell = '<div class="progress-cell"><span class="mono'+(isDone?' pct-done':'')+'" style="font-size:.8rem;">'+progress+'%</span>'+progressBar+'</div>';
      } else if(t.duration === 0){
        progressCell = '<label class="progress-check'+(isDone?' pct-done':'')+'"><input type="checkbox" '+(isDone?'checked':'')+' data-field="milestoneDone" data-task-id="'+t.id+'"> Concluído</label>';
      } else {
        progressCell = '<div class="progress-cell"><input class="progress-input'+(isDone?' pct-done':'')+'" type="number" min="0" max="100" step="5" value="'+progress+'" data-field="progress" data-task-id="'+t.id+'"><span class="pct-unit'+(isDone?' pct-done':'')+'">%</span>'+progressBar+'</div>';
      }

      var responsibleCell = p.showResponsible
        ? '<td><input class="responsible-input" type="text" value="'+esc(t.responsible)+'" data-field="responsible" data-task-id="'+t.id+'" placeholder="—"></td>'
        : '';
      var notesCell = p.showNotes
        ? '<td><input class="notes-input" type="text" value="'+esc(t.notes)+'" data-field="notes" data-task-id="'+t.id+'" placeholder="—" title="'+esc(t.notes)+'"></td>'
        : '';

      var canOutdent = !!t.parentId;
      var canIndent = hasPrevSibling(rows, rowIdx);
      var canUp = hasPrevSibling(rows, rowIdx);
      var canDown = hasNextSibling(rows, rowIdx);
      var leftBtns = '' +
        (canOutdent ? '<button class="row-icon-btn" type="button" data-action="outdent-task" data-id="'+t.id+'" title="Recuar para fora (sair deste nível)">⇤</button>' : '<span class="row-icon-spacer"></span>') +
        (canIndent ? '<button class="row-icon-btn" type="button" data-action="indent-task" data-id="'+t.id+'" title="Recuar para dentro (agrupar sob a atividade acima)">⇥</button>' : '<span class="row-icon-spacer"></span>') +
        (canUp ? '<button class="row-icon-btn" type="button" data-action="move-up" data-id="'+t.id+'" title="Mover para cima">↑</button>' : '<span class="row-icon-spacer"></span>') +
        (canDown ? '<button class="row-icon-btn" type="button" data-action="move-down" data-id="'+t.id+'" title="Mover para baixo">↓</button>' : '<span class="row-icon-spacer"></span>') +
        '<button class="row-icon-btn" type="button" data-action="add-subtask" data-id="'+t.id+'" title="Adicionar subatividade">+˅</button>' +
        '<button class="row-icon-btn'+(t.atRisk?' active-risk':'')+'" type="button" data-action="toggle-at-risk" data-id="'+t.id+'" title="'+(t.atRisk?'Remover marcação de risco':'Marcar como em risco')+'">⚠</button>' +
        (replanBadge ? '<button class="row-icon-btn" type="button" data-action="accept-baseline" data-id="'+t.id+'" title="Aceitar a data atual como nova referência (zera o replanejamento)">✓</button>' : '');
      var actions = '<div class="row-actions">' +
        '<div class="row-actions-left">'+leftBtns+'</div>' +
        '<button class="row-icon-btn danger" type="button" data-action="delete-task" data-id="'+t.id+'" title="Excluir atividade">'+(ui.pendingDelete && ui.pendingDelete.kind==='task' && ui.pendingDelete.id===t.id ? '<span class="mono" style="color:var(--rust); font-size:.68rem;">confirmar</span>' : '✕')+'</button>' +
      '</div>';

      var depsTd = p.showPredecessors ? ('<td>'+depsCell+'</td>') : '';

      return '' +
        '<tr class="'+rowClass.trim()+'" data-row-id="'+t.id+'">' +
          '<td class="code-cell"><span class="code-cell-inner">'+bulkCheckbox+(t.atRisk ? '<span class="risk-dot" title="Em risco"></span>' : '')+replanBadge+taskLabel(idx)+'</span></td>' +
          '<td><div class="name-cell" style="padding-left:'+(depth*18)+'px;">'+chevron+colorDot+'<input class="name-input" type="text" value="'+esc(t.name)+'" data-field="name" data-task-id="'+t.id+'" placeholder="Nome da atividade"></div></td>' +
          responsibleCell +
          '<td>'+durCell+'</td>' +
          depsTd +
          '<td class="date-cell">'+startCell+'</td>' +
          '<td class="date-cell">'+endCell+'</td>' +
          '<td>'+progressCell+'</td>' +
          notesCell +
          '<td>'+actions+'</td>' +
        '</tr>';
    }).join("");

    var respTh = p.showResponsible ? '<th>Responsável</th>' : '';
    var respCol = p.showResponsible ? '<col style="width:96px">' : '';
    var depsTh = p.showPredecessors ? '<th>Predecessoras</th>' : '';
    var depsCol = p.showPredecessors ? '<col style="width:136px">' : '';
    var notesTh = p.showNotes ? '<th>Observações</th>' : '';
    var notesCol = p.showNotes ? '<col style="width:150px">' : '';
    var colgroup = '<colgroup><col style="width:56px"><col style="width:24%">'+respCol+'<col style="width:114px">'+depsCol+'<col style="width:114px"><col style="width:114px"><col style="width:120px">'+notesCol+'<col style="width:150px"></colgroup>';
    var selectableIds = rows.filter(function(r){ return !full.isGroup(r.task.id); }).map(function(r){ return r.task.id; });
    var selectedCount = selectableIds.filter(function(id){ return ui.bulkSelectedIds.has(id); }).length;
    var selectAllChecked = selectableIds.length > 0 && selectedCount === selectableIds.length;
    var selectAllTh = '<th><label class="select-all-label" title="Selecionar ou limpar todas as atividades visíveis"><input type="checkbox" id="selectAllTasksCheckbox" data-action="toggle-select-all-tasks" '+(selectAllChecked?'checked':'')+'><span>#</span></label></th>';
    return '' +
      '<div class="table-wrap"><table class="task-table">'+colgroup+'<thead><tr>' +
        selectAllTh+'<th>Atividade</th>'+respTh+'<th>Duração</th>'+depsTh+'<th>Início</th><th>Término</th><th>% Concluído</th>'+notesTh+'<th></th>' +
      '</tr></thead><tbody>'+trs+'</tbody></table></div>' +
      '<p class="table-caption">Início e término são calculados automaticamente a partir da duração e das predecessoras — ou edite as datas diretamente (a duração e as atividades seguintes se ajustam sozinhas). Clique na bolinha para escolher uma cor, e em "◆" para marcar uma atividade como marco (escolha o ícone depois). Use "+˅" para criar uma subatividade (a atividade "mãe" passa a somar as datas das subatividades automaticamente) e ⇤ ⇥ ↑ ↓ para reorganizar a hierarquia e a ordem. Clique numa linha para selecioná-la — "Adicionar atividade" insere a nova logo abaixo dela.</p>';
  }

  function renderPopover(p){
    if(!ui.popover || !p) return '';
    var owner = p.tasks.filter(function(t){ return t.id === ui.popover.taskId; })[0];
    if(!owner) return '';
    var pos = ui.popover.pos || {top:80,left:80};
    if(ui.popover.type === "color"){
      var opts = '<button class="color-swatch-btn'+(!owner.color?' selected':'')+'" type="button" data-action="set-color" data-task-id="'+owner.id+'" data-color="" title="Automático"><span class="color-swatch-auto"></span></button>' +
        SWATCHES.map(function(s){
          return '<button class="color-swatch-btn'+(owner.color===s.key?' selected':'')+'" type="button" data-action="set-color" data-task-id="'+owner.id+'" data-color="'+s.key+'" title="'+s.label+'"><span class="color-swatch-dot" style="background:'+s.hex+';"></span></button>';
        }).join("");
      return '<div class="dep-menu" style="top:'+pos.top+'px; left:'+pos.left+'px;"><div class="dep-menu-title">Cor da atividade</div><div class="color-menu-grid">'+opts+'</div></div>';
    }
    if(ui.popover.type === "milestoneIcon"){
      var curIcon = owner.milestoneIcon || "diamond";
      var items2 = MILESTONE_ICONS.map(function(ic){
        var paint = resolveMilestonePaint(owner.color ? swatchHex(owner.color) : null, true);
        return '<button class="milestone-menu-item'+(curIcon===ic.key?' selected':'')+'" type="button" data-action="set-milestone-icon" data-task-id="'+owner.id+'" data-icon="'+ic.key+'">' +
          '<svg class="milestone-menu-preview" viewBox="0 0 20 20">'+milestoneShapeSvg(ic.key,10,10,7,paint)+'</svg>' +
          '<span>'+ic.label+'</span>' +
        '</button>';
      }).join("");
      return '<div class="dep-menu" style="top:'+pos.top+'px; left:'+pos.left+'px; width:190px;"><div class="dep-menu-title">Ícone do marco</div><div class="dep-menu-list">'+items2+'</div></div>';
    }
    // dep menu
    var full = computeFullSchedule(p);
    var childrenMapTmp = buildChildrenMap(p.tasks);
    var descendants = new Set(full.isGroup(owner.id) ? allDescendantIds(owner.id, childrenMapTmp) : []);
    var candidates = p.tasks.filter(function(t){ return t.id !== owner.id && !descendants.has(t.id); });
    function depItemHtml(t){
      var idx = p.tasks.findIndex(function(x){ return x.id === t.id; });
      var checked = (owner.deps||[]).indexOf(t.id) !== -1;
      var grp = full.isGroup(t.id) ? ' <span class="grp-tag">· agrupadora</span>' : '';
      return '<label class="dep-menu-item"><input type="checkbox" '+(checked?'checked':'')+' data-action="toggle-dep" data-task-id="'+owner.id+'" data-dep-id="'+t.id+'"><span class="code-cell">'+taskLabel(idx)+'</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.name||'(sem nome)')+'</span>'+grp+'</label>';
    }
    // The task immediately above owner in the displayed hierarchy is usually its
    // predecessor, so it's pinned to the top of the list (separated by a divider);
    // the rest keep the normal ascending order.
    var displayRows = buildDisplayRows(p);
    var ownerRowIdx = displayRows.findIndex(function(r){ return r.task.id === owner.id; });
    var prevRowId = ownerRowIdx > 0 ? displayRows[ownerRowIdx-1].task.id : null;
    var prevTask = prevRowId ? candidates.filter(function(t){ return t.id === prevRowId; })[0] : null;
    var restCandidates = prevTask ? candidates.filter(function(t){ return t.id !== prevTask.id; }) : candidates;
    var items = (prevTask ? (depItemHtml(prevTask) + '<div class="dep-menu-divider"></div>') : '') +
      restCandidates.map(depItemHtml).join("");
    var ownerIdx = p.tasks.findIndex(function(t){ return t.id === owner.id; });
    return '' +
      '<div class="dep-menu" style="top:'+pos.top+'px; left:'+pos.left+'px;">' +
        '<div class="dep-menu-title">Predecessoras de '+taskLabel(ownerIdx)+'</div>' +
        '<div class="dep-menu-list">'+(items || '<div class="dep-menu-empty">Nenhuma outra atividade neste projeto.</div>')+'</div>' +
        '<div class="dep-menu-foot"><button class="btn btn-sm" type="button" data-action="close-popover">Concluído</button></div>' +
      '</div>';
  }

  function renderQuickAddModal(){

      '<div class="modal-overlay" data-action="overlay-quickadd">' +

          '<p>Digite ou cole um nome de atividade por linha. Recue uma linha com Tab (ou dois espaços) para deixá-la como subatividade da linha anterior menos recuada. As atividades entram no fim da lista — duração, predecessoras e datas você ajusta depois.</p>' +
          '<textarea id="quickAddTextarea" spellcheck="false" placeholder="Levantamento de requisitos\nWireframes\n\tRevisão com cliente\nDesign visual">'+esc(ui.quickAddText)+'</textarea>' +
          (ui.quickAddError ? '<div class="modal-error">'+esc(ui.quickAddError)+'</div>' : '') +
          '<div class="modal-actions">' +
